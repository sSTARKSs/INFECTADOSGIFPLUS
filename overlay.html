<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay L4D - TikTok Studio</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; }
        #overlay-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; box-sizing: border-box; padding: 20px; }
        .bloque-grupo { display: none; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 65px 12px; animation: fadeIn 0.4s ease-in-out; }
        .bloque-grupo.activo { display: grid; }
        .bloque-grupo > div:nth-child(-n+4) { transform: translateY(35px); }
        
        /* Ajustes de posición vertical fina estándar */
        .bloque-grupo > div:nth-child(n+5) .nombre-flotante { top: -24px !important; }
        .bloque-grupo > div:nth-child(n+5) .texto-dos-lineas { top: -28px !important; }
        .bloque-grupo > div:nth-child(n+5) .multi-col { top: -30px !important; }
        
        /* Clase especial para forzar que las tarjetas 9 y 10 suban mucho más */
        .pos-alta { top: -48px !important; }
        
        .card { background: rgba(10, 12, 16, 0.85); border-radius: 12px; width: 190px; height: 240px; position: relative; border: 2px solid var(--c); box-shadow: 0 0 14px var(--s), inset 0 0 8px var(--s); box-sizing: border-box; }
        .img-box, .esq-izq { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .img-box { border-radius: 10px; overflow: hidden; z-index: 1; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8) contrast(1.1); }
        .esq-izq { z-index: 10; pointer-events: none; }
        
        /* Caja de regalos base */
        .gift-box { position: absolute; top: -34px; left: -22px; display: flex; gap: 4px; align-items: center; z-index: 20; }
        .tiktok-gift { position: relative; width: 58px; height: 58px; display: flex; justify-content: center; align-items: center; }
        .gift-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.8)); }
        .tap-tap-texto { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-family: 'Arial Black', Impact, sans-serif; font-size: 10px; font-weight: 900; color: #fff300; text-shadow: 1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000; white-space: nowrap; z-index: 35; letter-spacing: -0.3px; }
        
        /* --- SOLUCIÓN: ACOMODO VERTICAL EN COLUMNA PARA TARJETAS 1 Y 15 --- */
        .gift-box.doble-columna { display: flex; flex-direction: column-reverse; gap: 0; top: -45px; }
        /* ------------------------------------------------------------------ */
        
        /* Contorno BLANCO (#fff) con sombra negra para contraste sobre fondos oscuros */
        .nombre-flotante { position: absolute; font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; -webkit-text-stroke: 0.8px #fff; text-shadow: 2px 2px 2px #000, -1.5px -1.5px 2px #000, 1.5px -1.5px 2px #000, -1.5px 1.5px 2px #000; white-space: nowrap; z-index: 40; left: 50%; transform: translateX(-50%); top: -28px; font-size: 18px; animation: rgbCambiante 4s linear infinite; display: flex; justify-content: center; align-items: center; gap: 4px; width: 100%; text-align: center; }
        .texto-dos-lineas { display: flex; flex-direction: column; line-height: 0.95; font-size: 12px; top: -26px; }
        
        /* Estilos para múltiples infectados juntos */
        .multi-col { display: flex; flex-direction: row; justify-content: space-around; width: 100%; gap: 2px; font-size: 10px; top: -32px; padding: 0 6px; box-sizing: border-box; }
        .col-item { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
        .col-item span:first-child { font-size: 13px; }
        
        @keyframes rgbCambiante { 0%, 100% { color: #ff0050; } 33% { color: #00e5ff; } 66% { color: #00ff66; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="overlay-container"></div>
    <script>
        const container = document.getElementById('overlay-container'); 
        let bloqueActual = 0;
        const estilos = [
            {c:'#ca1aff', s:'rgba(202,26,255,0.7)'}, {c:'#ff0050', s:'rgba(255,0,80,0.7)'}, {c:'#00e5ff', s:'rgba(0,229,255,0.7)'}, {c:'#ff00aa', s:'rgba(255,0,170,0.7)'}, 
            {c:'#00ff66', s:'rgba(0,255,102,0.7)'}, {c:'#ffaa00', s:'rgba(255,170,0,0.7)'}, {c:'#9900ff', s:'rgba(153,0,255,0.7)'}, {c:'#ffea00', s:'rgba(255,234,0,0.7)'}
        ];
        const REGALOS = { SEGUIR: "seguir.webp", CORAZON_AZUL: "azul.webp", ROSA_1M: "rosa.webp", ROSA_BLANCA_METAL: "blanca.webp", TIKTOK_3D: "tiktok.webp", GG_3D: "gg.webp", COREANO: "coreano.webp", ROSE_30M: "rose.webp", ROSQUILLA: "rosquilla.webp", GAFAS: "gafas.webp", CONFETTI: "confetti.webp", HELADO: "helado.webp", PERFUME: "perfume.webp", GORRA: "gorra.webp", OSITO: "osito.webp" };
        
        const bloques = [
            [
                { id: 1, g: "1.gif", gifts: ["CORAZON_AZUL", "SEGUIR"], txt: ["10 WITCH"] }, { id: 2, g: "2.gif", gifts: ["ROSA_1M"], txt: ["1 TANK"] },   
                { id: 3, g: "3.gif", gifts: ["ROSA_BLANCA_METAL"], txt: ["BAILECITO DE", "10 SEGUNDOS"], tipo: "2l" }, { id: 4, g: "4.gif", gifts: ["TIKTOK_3D"], txt: ["5 WITCH"] },
                { id: 5, g: "5.gif", gifts: ["GG_3D"], txt: ["10 CHARGER"] }, { id: 6, g: "6.gif", gifts: ["COREANO"], txt: ["10 TANK"] }, 
                { id: 7, g: "7.gif", gifts: ["ROSE_30M"], txt: [["20", "HUNTER"], ["20", "WITCH"]], tipo: "m" }, { id: 8, g: "8.gif", gifts: ["ROSQUILLA"], txt: [["20", "HUNTER"], ["20", "SMOKER"]], tipo: "m" }
            ],
            [
                { id: 9, g: "9.gif", gifts: ["GAFAS"], txt: [["5", "SMOKER"], ["5", "HUNTER"], ["10", "WITCH"]], tipo: "m" },    
                { id: 10, g: "10.gif", gifts: ["CONFETTI"], txt: [["10", "SMOKER"], ["10", "SPITTER"], ["10", "CHARGER"]], tipo: "m" }, 
                { id: 11, g: "11.gif", gifts: ["HELADO"], txt: [["5", "SPITTER"], ["5", "JOCKEYS"]], tipo: "m" },   
                { id: 12, g: "12.gif", gifts: ["PERFUME"], txt: [["5", "BOOMER"], ["5", "SPITTER"]], tipo: "m" },
                { id: 13, g: "13.gif", gifts: ["GORRA"], txt: [["10", "SMOKER"], ["10", "TANK"]], tipo: "m" }, 
                { id: 14, g: "14.gif", gifts: ["OSITO"], txt: ["40 TANK"] }, { id: 15, g: "1.gif", gifts: ["CORAZON_AZUL", "SEGUIR"], txt: ["10 WITCH"] }, { id: 16, g: "2.gif", gifts: ["ROSA_1M"], txt: ["1 TANK"] } 
            ]
        ];

        function genTxt(t) {
            if (!t.txt) return '';
            
            var claseExtra = (t.id === 9 || t.id === 10) ? ' pos-alta' : '';
            var estiloExtra = (t.id === 8) ? ' style="margin-left: 20px !important;"' : '';
            
            if (t.tipo === "2l") {
                var l1 = t.txt[0];
                var l2 = t.txt[1];
                return '<div class="nombre-flotante texto-dos-lineas' + claseExtra + '"><span>' + l1 + '</span><span>' + l2 + '</span></div>';
            }
            
            if (t.tipo === "m") {
                var columnas = t.txt.map(function(c) {
                    var cant = c[0];
                    var inf = c[1];
                    return '<div class="col-item"><span>' + cant + '</span><span>' + inf + '</span></div>';
                }).join('');
                return '<div class="nombre-flotante multi-col' + claseExtra + '"' + estiloExtra + '>' + columnas + '</div>';
            }
            
            var tNormal = t.txt[0];
            return '<div class="nombre-flotante' + claseExtra + '">' + tNormal + '</div>';
        }

        container.innerHTML = bloques.map(grupo => `
            <div class="bloque-grupo">
                ${grupo.map((t, i) => {
                    const tieneAmbos = t.gifts.includes("CORAZON_AZUL") && t.gifts.includes("SEGUIR");
                    return `
                    <div class="card" style="--c:${estilos[i].c}; --s:${estilos[i].s}">
                        ${genTxt(t)}
                        <div class="img-box"><img src="${t.g}" alt="Infectado"></div>
                        <div class="esq-izq">
                            <div class="gift-box ${tieneAmbos ? 'doble-columna' : ''}">
                                ${t.gifts.filter(k => REGALOS[k]).map(k => `
                                    <div class="tiktok-gift">
                                        ${k === "CORAZON_AZUL" ? '<div class="tap-tap-texto">TAP TAP</div>' : ''}
                                        <img class="gift-img" src="regalos/${REGALOS[k]}" alt="${k}" loading="lazy">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    `;
                }).join('')}
            </div>
        `).join('');

        const elementos = container.getElementsByClassName('bloque-grupo');
        function rotar() {
            const activo = container.querySelector('.bloque-grupo.activo');
            if (activo) activo.classList.remove('activo');
            if (elementos[bloqueActual]) elementos[bloqueActual].classList.add('activo');
            bloqueActual = (bloqueActual + 1) % bloques.length;
        }
        rotar(); setInterval(rotar, 12000);
    </script>
</body>
</html>
