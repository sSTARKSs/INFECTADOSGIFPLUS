<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay de Infectados - Formato TikTok GIF</title>
    <style>
        /* Fondo transparente e ideal para transmisiones verticales (9:16) */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor compacto optimizado para el ancho de TikTok */
        #overlay-container {
            display: flex;
            gap: 10px;          /* Espacio original entre tarjetas */
            padding: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;        /* Se adapta al ancho vertical de TikTok */
            box-sizing: border-box;
        }

        /* ANIMACIÓN PARA QUE LOS BORDES CAMBIEN DE COLOR (RGB) */
        @keyframes rgbBorde {
            0% {
                border-color: #ff0055;
                box-shadow: 0px 0px 12px rgba(255, 0, 85, 0.6);
            }
            25% {
                border-color: #a000ff;
                box-shadow: 0px 0px 12px rgba(160, 0, 255, 0.6);
            }
            50% {
                border-color: #00e5ff;
                box-shadow: 0px 0px 12px rgba(0, 229, 255, 0.6);
            }
            75% {
                border-color: #00ff66;
                box-shadow: 0px 0px 12px rgba(0, 255, 102, 0.6);
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0px 0px 12px rgba(255, 0, 85, 0.6);
            }
        }

        /* Tarjetas con el tamaño original grande para que se vean perfectas */
        .card {
            background: rgba(16, 20, 26, 0.95);
            border: 2px solid #ff0055; 
            border-radius: 8px;
            width: 105px;       
            padding: 4px;
            text-align: center;
            position: relative; /* Necesario para posicionar textos encima */
            
            /* Animación RGB */
            animation: rgbBorde 6s linear infinite;
            
            /* Animación de entrada y salida */
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Activador de la animación */
        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Configuración de la imagen */
        .avatar {
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16; 
            object-fit: cover;
            border-radius: 5px;
            display: block;
        }

        /* --- DETALLES DE TEXTO EXCLUSIVOS PARA LA WITCH --- */
        .witch-labels {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 10;
        }

        .label-top {
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
            line-height: 1;
        }

        .label-mid {
            font-size: 14px;
            color: #ff3333; /* Rojo para destacar el nombre del boss */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Contenedor del corazón azul abajo */
        .blue-heart-container {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* Icono de corazón azul brillante */
        .heart-icon {
            font-size: 34px;
            color: #00bfff;
            filter: drop-shadow(0px 0px 6px rgba(0, 191, 255, 0.8));
            position: relative;
        }

        /* Texto 1K metido exactamente en el centro del corazón */
        .heart-text {
            position: absolute;
            font-family: 'Arial Black', sans-serif;
            font-size: 11px;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding-bottom: 2px; /* Ajuste milimétrico vertical */
        }
    </style>
</head>
<body>

    <div id="overlay-container"></div>

    <script>
        // LISTA INTEGRAL ACTUALIZADA CON TUS 14 INFECTADOS
        // He configurado el elemento del "3.gif" como la Witch basándome en el orden de tu imagen
        const listaInfectados = [
            {img:"1.gif"}, 
            {img:"2.gif"}, 
            {img:"3.gif"}, 
            {img:"4.gif"},
            {img:"5.gif"}, 
            {img:"6.gif"}, 
            {img:"7.gif"}, 
            {img:"8.gif"},
            {img:"9.gif"}, 
            {img:"10.gif"}, 
            {img:"11.gif"}, 
            {img:"12.gif"},
            {img:"13.gif"}, 
            {img:"14.gif"}
        ];

        let indiceActual = 0;
        const itemsPorPagina = 4; 
        const contenedor = document.getElementById('overlay-container');

        function rotarInfectados() {
            const tarjetasActuales = document.querySelectorAll('.card');
            tarjetasActuales.forEach(card => card.classList.remove('visible'));

            setTimeout(() => {
                contenedor.innerHTML = '';

                // El sistema dibuja solo 4 elementos grandes en pantalla centralizada
                for (let i = 0; i < itemsPorPagina; i++) {
                    let piezaIndex = (indiceActual + i) % listaInfectados.length;
                    let inf = listaInfectados[piezaIndex];

                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Condición para inyectar el diseño personalizado si es la Witch
                    if (inf.esWitch) {
                        card.innerHTML = `
                            <div class="witch-labels">
                                <span class="label-top">10</span>
                                <span class="label-mid">WITCH</span>
                            </div>
                            <img class="avatar" src="${inf.img}" alt="Infectado">
                            <div class="blue-heart-container">
                                <span class="heart-icon">💙</span>
                                <span class="heart-text">1K</span>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `<img class="avatar" src="${inf.img}" alt="Infectado">`;
                    }
                    
                    contenedor.appendChild(card);

                    setTimeout(() => card.classList.add('visible'), i * 100);
                }

                indiceActual = (indiceActual + itemsPorPagina) % listaInfectados.length;
            }, 500);
        }

        rotarInfectados();
        setInterval(rotarInfectados, 8000); // Cambia de tanda cada 8 segundos
    </script>
</body>
</html>
