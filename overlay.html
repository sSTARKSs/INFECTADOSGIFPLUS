<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay L4D Horizontal - TikTok Studio Edition Premium</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
/* CONEXIÓN NATIVA AL LIENZO FULL HD SIN LAG */
html, body { 
    margin: 0 !important; 
    padding: 0 !important;
    background: transparent !important; 
    overflow: hidden !important; 
    width: 1920px !important; 
    height: 1080px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    font-family: 'Bebas Neue', sans-serif !important; 
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
    position: relative !important;
}

/* CONTENEDOR MAESTRO EN MATRIZ FLUIDA DE HARDWARE */
#overlay-container { 
    display: flex !important; 
    gap: 0.3cm !important; 
    justify-content: center !important; 
    align-items: flex-start !important; 
    box-sizing: border-box !important; 
    width: 6400px !important; 
    height: 2400px !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) scale(0.27) translate3d(0,0,0) !important; 
    transform-origin: center center !important;
    backface-visibility: hidden !important;
    -webkit-backface-visibility: hidden !important;
    perspective: 1000px !important;
}

/* RECUADROS CON FONDO SÓLIDO EQUILIBRADO */
.bloque-heroes { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    gap: 0px !important; 
    margin: 0 !important;
    padding: 20px !important;
    border-radius: 24px !important;
    background: #062617 !important; 
    border: 6px solid #00ff88 !important; 
    box-shadow: 0 0 50px rgba(0, 255, 136, 0.3) !important;
}

.bloque-villanos { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    gap: 0px !important; 
    margin: 0 !important;
    padding: 20px !important;
    border-radius: 24px !important;
    background: #2b030c !important; 
    border: 6px solid #ff003c !important; 
    box-shadow: 0 0 50px rgba(255, 0, 60, 0.3) !important;
}

/* CUADRÍCULAS CON ESPACIADO FLUIDO */
.cuadrilla-heroes { 
    display: grid !important; 
    grid-template-columns: repeat(2, 540px) !important; 
    grid-template-rows: repeat(3, 680px) !important; 
    gap: 16px 16px !important; 
}
.cuadrilla-villanos { 
    display: grid !important; 
    grid-template-columns: repeat(7, 540px) !important; 
    grid-template-rows: repeat(3, 680px) !important; 
    gap: 16px 16px !important; 
}

/* CONFIGURACIÓN ANCHA EXCLUSIVA */
.cuadrilla-villanos .c-11,
.cuadrilla-villanos .c-14,
.cuadrilla-villanos .c-16,
.cuadrilla-villanos .c-17 {
    grid-column: span 2 !important; 
    width: 1096px !important; 
}

.c-11 .svg-wrapper-top, .c-14 .svg-wrapper-top, .c-16 .svg-wrapper-top, .c-17 .svg-wrapper-top { width: 1085px !important; }
.c-11 .svg-wrapper-bottom, .c-14 .svg-wrapper-bottom, .c-16 .svg-wrapper-bottom, .c-17 .svg-wrapper-bottom { width: 1085px !important; }

/* CABECERAS VECTORIALES */
.svg-wrapper-title-heroes { width: 1080px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 0 -10px 0 !important; }
.svg-wrapper-title-villanos { width: 3780px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 0 -10px 0 !important; }

/* MARCADORES INTERNOS */
.svg-wrapper-top { position: absolute !important; top: -15px !important; left: -15px !important; width: 545px !important; height: 160px !important; z-index: 45 !important; pointer-events: none !important; }
.svg-wrapper-bottom { position: absolute !important; bottom: -15px !important; left: -15px !important; width: 545px !important; height: 320px !important; z-index: 45 !important; pointer-events: none !important; }


/* TEXTO DE LA WITCH EN LA ESQUINA SUPERIOR DERECHA ABSOLUTA */
.texto-witch-premium {
    position: absolute !important;
    top: 30px !important;
    right: 35px !important;
    font-family: 'Bebas Neue', sans-serif !important;
    font-size: 85px !important;
    font-style: italic !important;
    font-weight: 900 !important;
    color: #ffffff !important;
    text-shadow: 5px 5px 0px #040508, -5px -5px 0px #040508, 5px -5px 0px #040508, -5px 5px 0px #040508 !important;
    z-index: 50 !important;
}

@keyframes pulso-quantum {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* BASE DE LA TARJETA ACELERADA */
.card { 
    position: relative !important; 
    box-sizing: border-box !important; 
    overflow: visible !important;
    background: #040508 !important;
    transform: translate3d(0, 0, 0) !important;
    backface-visibility: hidden !important;
}

.card::before {
    content: '' !important;
    position: absolute !important;
    top: -4px !important;
    left: -4px !important;
    right: -4px !important;
    bottom: -4px !important;
    z-index: -1 !important;
    background-size: 200% 200% !important; 
    animation: pulso-quantum 4s linear infinite !important; 
}

.cuadrilla-heroes .card::before { background-image: linear-gradient(270deg, #00ff88, #014d25, #00ff88) !important; }
.cuadrilla-villanos .card::before { background-image: linear-gradient(270deg, #ff003c, #4d0012, #ff003c) !important; }

.cuadrilla-heroes .card { clip-path: polygon(12% 0%, 100% 0%, 100% 88%, 88% 100%, 0% 100%, 0% 12%) !important; }
.cuadrilla-villanos .card { clip-path: polygon(0% 0%, 88% 0%, 100% 12%, 100% 100%, 12% 100%, 0% 88%) !important; }
.cuadrilla-villanos .c-11, .cuadrilla-villanos .c-14, .cuadrilla-villanos .c-16, .cuadrilla-villanos .c-17 {
    clip-path: polygon(0% 0%, 94% 0%, 100% 12%, 100% 100%, 6% 100%, 0% 88%) !important;
}

/* CONTENEDOR DE IMÁGENES ANTI-LAG */
.img-box { 
    position: absolute !important; 
    top: 3px !important; 
    left: 3px !important; 
    width: calc(100% - 6px) !important; 
    height: calc(100% - 6px) !important; 
    overflow: hidden !important; 
    z-index: 1 !important;
    background: #040508 !important;
}
.cuadrilla-heroes .img-box { clip-path: polygon(12% 0%, 100% 0%, 100% 88%, 88% 100%, 0% 100%, 0% 12%) !important; }
.cuadrilla-villanos .img-box { clip-path: polygon(0% 0%, 88% 0%, 100% 12%, 100% 100%, 12% 100%, 0% 88%) !important; }
.cuadrilla-villanos .c-11 .img-box, .cuadrilla-villanos .c-14 .img-box, .cuadrilla-villanos .c-16 .img-box, .cuadrilla-villanos .c-17 .img-box {
    clip-path: polygon(0% 0%, 94% 0%, 100% 12%, 100% 100%, 6% 100%, 0% 88%) !important;
}
.img-box img { 
    width: 100% !important; 
    height: 100% !important; 
    object-fit: cover !important; 
    transform: translateZ(0) !important;
    will-change: transform !important;
    image-rendering: -webkit-optimize-contrast !important;
}

/* CAJAS CON EFECTO DIAMANTE CRISTALINO RESALTADO */
.esq-der-regalo { 
    position: absolute !important; 
    bottom: 25px !important; 
    right: 25px !important; 
    width: 220px !important; 
    height: 190px !important; 
    background: linear-gradient(135deg, rgba(240, 248, 255, 0.25), rgba(255, 255, 255, 0.45)) !important; /* Brillo de Diamante */
    backdrop-filter: blur(15px) !important; 
    -webkit-backdrop-filter: blur(15px) !important;
    border: 4px solid rgba(220, 235, 255, 0.8) !important; /* Borde Platino Claro */
    border-radius: 18px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    z-index: 20 !important; 
    box-shadow: 0 0 35px rgba(230, 245, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5) !important; /* Resplandor Diamante */
}
.esq-der-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5)) !important; }

.esq-der-doble { 
    position: absolute !important; 
    bottom: 25px !important; 
    right: 25px !important; 
    display: flex !important; 
    flex-direction: row !important; 
    align-items: center !important; 
    gap: 16px !important; 
    z-index: 20 !important; 
}

.sub-box-regalo { 
    width: 220px !important; 
    height: 190px !important; 
    background: linear-gradient(135deg, rgba(240, 248, 255, 0.25), rgba(255, 255, 255, 0.45)) !important; 
    backdrop-filter: blur(15px) !important;
    -webkit-backdrop-filter: blur(15px) !important;
    border: 4px solid rgba(220, 235, 255, 0.8) !important; 
    border-radius: 18px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    box-shadow: 0 0 35px rgba(230, 245, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5) !important;
}
.sub-box-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5)) !important; }

/* TEXTOS INTERNOS CRISP */
.texto-seguir-interno, .texto-taptap-interno { 
    position: absolute !important; 
    top: 6px !important; 
    left: 50% !important; 
    transform: translateX(-50%) !important; 
    font-family: 'Bebas Neue', sans-serif; 
    font-size: 24px; 
    font-weight: 900; 
    color: #ffffff; 
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000 !important; 
    white-space: nowrap; 
    z-index: 25; 
}
</style>
</head>
<body>

<div id="overlay-container"></div>



<script>
const container = document.getElementById('overlay-container');

const REGALOS = { 
    BOSQUE: "bosque.webp", CAPIBARA: "capibara.webp", CABEZA: "cabeza.webp", CORAZON: "corazon.webp", 
    LENTO: "lento.webp", PASE: "pase.webp", INCREIBLE: "increible.webp", SEGUIR: "seguir.webp", 
    CORAZON_AZUL: "azul.webp", ROSA_1M: "rosa.webp", ROSA_BLANCA_METAL: "blanca.webp", 
    TIKTOK_3D: "tiktok.webp", GG_3D: "gg.webp", ROSE_30M: "rose.webp", ROSQUILLA: "rosquilla.webp", 
    GAFAS: "gafas.webp", CONFETTI: "confetti.webp", GORRA: "gorra.webp", OSITO: "osito.webp",
    ADORO: "adoro.webp", ALAS: "alas.webp", APLAUSO: "aplauso.webp", CONO: "cono.webp",
    PERFUME: "perfume.webp", GALAXIA: "galaxia.webp"
};

const tarjetasHeroes = [
    { g: "5.webp", c: "c-h1", id: "DAR VIDA", gift: "ADORO", esHeroe: true }, 
    { g: "6.webp", c: "c-h2", id: "VIDA TODOS", gift: "ALAS", esHeroe: true },
    { g: "7.webp", c: "c-h3", id: "ARMA RANDOM", gift: "APLAUSO", esHeroe: true },
    { g: "8.webp", c: "c-h4", id: "MATAR ENEMIGOS", gift: "CONO", esHeroe: true },
    { g: "22.webp", c: "c-h5", id: "CURAR COMPA", gift: "PERFUME", esHeroe: true }, 
    { g: "23.webp", c: "c-h6", id: "APAGAR LIVE", gift: "GALAXIA", esHeroe: true }
];

const tarjetasVillanos = [
    { g: "1.webp", c: "c-1", mult: "X5", dobleGift: true, esWitch: true }, 
    { g: "2.webp", c: "c-2", infNombre: "TANK", mult: "X1", gift: "ROSA_1M" }, 
    { g: "3.webp", c: "c-3", infNombre: "JOCKEY", mult: "X1", gift: "ROSA_BLANCA_METAL" }, 
    { g: "4.webp", c: "c-4", infNombre: "CHARGER", mult: "X1", gift: "TIKTOK_3D" }, 
    { g: "9.webp", c: "c-5", infNombre: "HUNTER", mult: "X1", gift: "GG_3D" },
    { g: "10.webp", c: "c-6", infNombre: "SMOKER", mult: "X1", gift: "INCREIBLE" },
    { g: "11.webp", c: "c-7", infNombre: "TANK", mult: "X10", gift: "CORAZON" },
    { g: "4.webp", c: "c-8", infNombre: "CHARGER", mult: "X10", gift: "CABEZA" }, 
    { g: "13.webp", c: "c-9", infNombre: "SMOKER HUNTER WITCH", mult: "X30", gift: "LENTO" }, 
    { g: "14.webp", c: "c-10", infNombre: "SMOKER SPITTER CHARGER", mult: "X30", gift: "PASE" }, 
    { g: "15.webp", c: "c-11", infNombre: "INCAPACITAR SUPERVIVIENTES", gift: "ROSE_30M" }, 
    { g: "16.webp", c: "c-12", infNombre: "ATAQUE AEREO", gift: "BOSQUE" }, 
    { g: "17.webp", c: "c-13", infNombre: "REINICIAR MAPA", gift: "CAPIBARA" }, 
    { g: "18.webp", c: "c-14", infNombre: "ELIMINAR SUPERVIVIENTES", gift: "ROSQUILLA" }, 
    { g: "19.webp", c: "c-15", infNombre: "SMOKER TANK", mult: "X40", gift: "GORRA" }, 
    { g: "20.webp", c: "c-16", infNombre: "HUNTER WITCH", mult: "X40", gift: "CONFETTI" }, 
    { g: "21.webp", c: "c-17", infNombre: "CAOS TOTAL", mult: "X50", gift: "OSITO" }
];

function drawSvgTitleHeroes() {
    return `<svg class="svg-wrapper-title-heroes" viewBox="0 0 1080 160">
        <text x="50%" y="115" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="105px" font-style="italic" text-anchor="middle" fill="#00ff88" stroke="#040508" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">HEROES</text>
    </svg>`;
}

function drawSvgTitleVillanos() {
    return `<svg class="svg-wrapper-title-villanos" viewBox="0 0 3780 160">
        <text x="50%" y="115" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="105px" font-style="italic" text-anchor="middle" fill="#ff003c" stroke="#040508" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">VILLANOS</text>
    </svg>`;
}

function drawSvgTop(multiplicador) {
    return `<svg class="svg-wrapper-top" viewBox="0 0 545 160">
        <text x="35" y="115" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="90px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">${multiplicador}</text>
    </svg>`;
}


function drawSvgBottomHeroeManual(textoId) {
    let palabras = String(textoId).trim().split(/\s+/);
    let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 540 280">`;
    
    if (palabras.length === 2) {
        htmlSvg += `<text x="18" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${palabras[0]}</text>`;
        htmlSvg += `<text x="18" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${palabras[1]}</text>`;
    } else {
        htmlSvg += `<text x="18" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="64px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${textoId}</text>`;
    }
    return htmlSvg + `</svg>`;
}

function drawSvgBottomVillano(texto) {
    let palabras = String(texto).trim().split(/\s+/);
    let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 540 280">`;
    
    if (palabras.length === 3) {
        htmlSvg += `<text x="18" y="120" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="46px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="13" stroke-linejoin="round" paint-order="stroke fill">${palabras[0]}</text>`;
        htmlSvg += `<text x="18" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="46px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="13" stroke-linejoin="round" paint-order="stroke fill">${palabras[1]}</text>`;
        htmlSvg += `<text x="18" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="46px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="13" stroke-linejoin="round" paint-order="stroke fill">${palabras[2]}</text>`;
    } else if (palabras.length === 2) {
        htmlSvg += `<text x="18" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="56px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="14" stroke-linejoin="round" paint-order="stroke fill">${palabras[0]}</text>`;
        htmlSvg += `<text x="18" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="56px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="14" stroke-linejoin="round" paint-order="stroke fill">${palabras[1]}</text>`;
    } else {
        htmlSvg += `<text x="18" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="64px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${texto}</text>`;
    }
    return htmlSvg + `</svg>`;
}

function generarTarjetaHTML(t) {
    let esTarjetaAncha = (t.c === "c-11" || t.c === "c-14" || t.c === "c-16" || t.c === "c-17");
    let anchoEstilo = esTarjetaAncha ? 'width: 1096px !important;' : 'width: 540px !important;';
    let html = `<div class="card ${t.c}" style="${anchoEstilo} height: 680px !important;">`; 
    
    if (t.esWitch) {
        html += `<div class="texto-witch-premium">WITCH</div>`;
    }
    
    if (t.mult) {
        if (esTarjetaAncha) {
            html += `<svg class="svg-wrapper-top" viewBox="0 0 1096 160">
                <text x="35" y="115" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="95px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">${t.mult}</text>
            </svg>`;
        } else {
            html += drawSvgTop(t.mult);
        }
    }
    html += `<div class="img-box"><img src="${t.g}" alt="Icono"></div>`;
    
    if (t.esHeroe) {
        html += drawSvgBottomHeroeManual(t.id);
    } else if (t.infNombre) {
        if (esTarjetaAncha) {
            let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 1080 280">`;
            if (t.infNombre === "INCAPACITAR SUPERVIVIENTES") {
                htmlSvg += `<text x="25" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">INCAPACITAR</text>`;
                htmlSvg += `<text x="25" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">SUPERVIVIENTES</text>`;
            } else if (t.infNombre === "ELIMINAR SUPERVIVIENTES") {
                htmlSvg += `<text x="25" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">ELIMINAR</text>`;
                htmlSvg += `<text x="25" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">SUPERVIVIENTES</text>`;
            } else {
                let palabras = String(t.infNombre).trim().split(/\s+/);
                if(palabras.length === 2) {
                    htmlSvg += `<text x="25" y="180" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${palabras[0]}</text>`;
                    htmlSvg += `<text x="25" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="58px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${palabras[1]}</text>`;
                } else {
                    htmlSvg += `<text x="25" y="240" font-family="'Bebas Neue', sans-serif" font-weight="900" font-size="64px" font-style="italic" fill="#ffffff" stroke="#040508" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">${t.infNombre}</text>`;
                }
            }
            html += htmlSvg + `</svg>`;
        } else {
            html += drawSvgBottomVillano(t.infNombre);
        }
    }
    
    if (t.dobleGift) {
        html += `<div class="esq-der-doble">` +
                    `<div class="sub-box-regalo">` +
                        `<div class="texto-seguir-interno">SEGUIRME</div>` +
                        `<img src="regalos/${REGALOS.SEGUIR}" alt="Seguir">` +
                    `</div>` +
                    `<div class="sub-box-regalo">` +
                        `<div class="texto-taptap-interno">TAP TAP</div>` + 
                        `<img src="regalos/${REGALOS.CORAZON_AZUL}" alt="Azul">` +
                    `</div>` +
                `</div>`;
    } else if (t.gift && REGALOS[t.gift]) {
        html += `<div class="esq-der-regalo"><img src="regalos/${REGALOS[t.gift]}" alt="Regalo"></div>`;
    }
    return html + `</div>`;
}

if (container) {
    let estructuraFinal = `<div class="bloque-heroes">${drawSvgTitleHeroes()}<div class="cuadrilla-heroes">`;
    tarjetasHeroes.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    estructuraFinal += `</div></div><div class="bloque-villanos">${drawSvgTitleVillanos()}<div class="cuadrilla-villanos">`;
    tarjetasVillanos.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    container.innerHTML = estructuraFinal + `</div></div>`;
}
</script>
</body>
</html>
