<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Overlay L4D - TikTok Studio</title>
    <style>
        body { margin:0; padding:0; background:transparent; overflow:hidden; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; font-family:Arial,sans-serif; }
        
        #overlay-container { 
            display:flex; flex-direction:row; justify-content:center; align-items:center; gap:25px; padding:25px; max-width:100%; max-height:100%; box-sizing:border-box;
        }
        
        .card { 
            background:rgba(10,12,16,0.85); border-radius:12px; width:210px; height:340px; position:relative; overflow:visible; display:flex; flex-direction:column; border:2px solid #ffffff; 
            box-sizing:border-box; transition: border-color 0.1s, box-shadow 0.1s;
        }

        .img-box { width:100%; height:100%; position:absolute; border-radius:10px; overflow:hidden; z-index:1; }
        .img-box img { width:100%; height:100%; object-fit:cover; filter:brightness(0.75) contrast(1.1); }
        .esq-izq { position:absolute; top:0; left:0; width:100%; height:100%; z-index:10; overflow:visible; pointer-events:none; }
        
        .icon-container-flotante { position:absolute; top:-48px; left:-30px; display:flex; gap:8px; overflow:visible; }
        .img-icon-flotante { width:68px; height:68px; filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.6)); position:relative; }
        .icon-especial-0 { width:72px; height:72px; filter:drop-shadow(2px 4px 6px #000); }
        
        /* Ajuste de pantalla vertical para TikTok */
        @media (max-width:768px) or (orientation:portrait) {
            #overlay-container { flex-direction:column; gap:55px; padding:60px 10px; }
            .card { width:140px; height:185px; }
            .icon-container-flotante { transform:scale(0.75); transform-origin:top left; }
        }
    </style>
</head>
<body>
    <div id="overlay-container"></div>
    <script>
        const container = document.getElementById('overlay-container'); 
        let bloqueActual = 0;

        // Colores fijos estables por posición para evitar parpadeos cromáticos
        const estilosFijos = [
            {c:'#ca1aff', s:'rgba(202,26,255,0.7)'}, // Tarjeta 1
            {c:'#ff0050', s:'rgba(255,0,80,0.7)'},  // Tarjeta 2
            {c:'#00e5ff', s:'rgba(0,229,255,0.7)'},  // Tarjeta 3
            {c:'#ff00aa', s:'rgba(255,0,170,0.7)'}  // Tarjeta 4
        ];

        const bloques = [
            [
                { g: "1.gif", i: ["regalos/azul.webp", "regalos/seguir.webp"] },
                { g: "2.gif", i: ["regalos/rosa.webp"] },   
                { g: "3.gif", i: ["regalos/blanca.webp"] }, 
                { g: "4.gif", i: ["regalos/tiktok.webp"] }
            ],
            [
                { g: "5.gif", i: ["regalos/gg.webp"] }, 
                { g: "6.gif", i: ["regalos/coreano.webp"] }, 
                { g: "7.gif", i: ["regalos/rose.webp"] }, 
                { g: "8.gif", i: ["regalos/rosquilla.webp"] } 
            ],
            [
                { g: "9.gif", i: ["regalos/gafas.webp"] },    
                { g: "10.gif", i: ["regalos/confetti.webp"] }, 
                { g: "11.gif", i: ["regalos/helado.webp"] },   
                { g: "12.gif", i: ["regalos/perfume.webp"] }   
            ],
            [
                { g: "13.gif", i: ["regalos/gorra.webp"] }, 
                { g: "14.gif", i: ["regalos/osito.webp"] }, 
                { g: "1.gif", i: ["regalos/azul.webp", "regalos/seguir.webp"] },       
                { g: "2.gif", i: ["regalos/rosa.webp"] }               
            ]
        ];

        // Pixel transparente seguro de 1x1 para limpiar imágenes sin romper el DOM
        const pixelTransparente = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        // 1. Crear las 4 tarjetas físicas permanentes una sola vez
        for (let i = 0; i < 4; i++) {
            const card = document.createElement('div');
            card.id = `card-${i}`;
            card.className = 'card';
            
            // Asignar bordes fijos iniciales
            let estilo = estilosFijos[i];
            card.style.borderColor = estilo.c; 
            card.style.boxShadow = `0 0 18px ${estilo.s}, inset 0 0 10px ${estilo.s}`;

            // Contenedores internos fijos con dos imágenes img preparadas para recibir rutas
            card.innerHTML = `
                <div class="img-box"><img id="gif-fondo-${i}" src="${pixelTransparente}"></div>
                <div class="esq-izq">
                    <div class="icon-container-flotante">
                        <img id="icono-flotante-${i}-0" class="img-icon-flotante" src="${pixelTransparente}">
                        <img id="icono-flotante-${i}-1" class="img-icon-flotante" src="${pixelTransparente}">
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        // 2. Rotación por intercambio directo de atributos de imagen (0 cambios de estructura)
        function rotarSincronizado() {
            const grupo = bloques[bloqueActual];

            for (let i = 0; i < 4; i++) {
                const dataTarjeta = grupo[i];
                
                // Cambiar el GIF de fondo directamente
                const imgFondo = document.getElementById(`gif-fondo-${i}`);
                if(imgFondo.src !== dataTarjeta.g) {
                    imgFondo.src = dataTarjeta.g;
                }

                // Administrar los dos espacios de iconos flotantes posibles
                const imgIcono0 = document.getElementById(`icono-flotante-${i}-0`);
                const imgIcono1 = document.getElementById(`icono-flotante-${i}-1`);

                // Resetear ID especial de la primera tarjeta para evitar conflictos
                imgIcono0.removeAttribute('id-especial');
                imgIcono0.className = "img-icon-flotante";

                if (dataTarjeta.i && dataTarjeta.i.length > 0) {
                    // Cargar primer icono
                    imgIcono0.src = dataTarjeta.i[0];
                    
                    // Truco de tamaño especial si es el primer bloque, primera tarjeta
                    if (i === 0 && bloqueActual === 0) {
                        imgIcono0.className = "img-icon-flotante icon-especial-0";
                    }

                    // Cargar segundo icono si existe, si no, ponerlo transparente
                    if (dataTarjeta.i.length > 1) {
                        imgIcono1.src = dataTarjeta.i[1];
                        imgIcono1.style.display = "block";
                    } else {
                        imgIcono1.src = pixelTransparente;
                        imgIcono1.style.display = "none";
                    }
                } else {
                    // Si no hay iconos en este bloque, limpiar ambos con el píxel transparente
                    imgIcono0.src = pixelTransparente;
                    imgIcono1.src = pixelTransparente;
                }
            }

            // Cambiar de bloque de forma cíclica
            bloqueActual = (bloqueActual + 1) % bloques.length;
        }

        // Ejecutar sistema de inmediato
        rotarSincronizado(); 
        setInterval(rotarSincronizado, 12000);
    </script>
</body>
</html>
