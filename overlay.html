<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay de Infectados Rotatorio - TikTok</title>
    <style>
        /* Fondo transparente e ideal para transmisiones verticales (9:16) */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR DE 4 COLUMNAS EN UNA SOLA FILA HORIZONTAL */
        #overlay-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: nowrap;   
            gap: 12px;          
            padding: 10px;
            justify-content: center;
            align-items: center;
            width: auto;        
            box-sizing: border-box;
        }

        /* ANIMACIÓN PARA QUE LOS BORDES RGB CAMBIEN SUAVEMENTE */
        @keyframes rgbBorde {
            0% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
            25% {
                border-color: #a000ff;
                box-shadow: 0px 0px 14px rgba(160, 0, 255, 0.7);
            }
            50% {
                border-color: #00e5ff;
                box-shadow: 0px 0px 14px rgba(0, 229, 255, 0.7);
            }
            75% {
                border-color: #00ff66;
                box-shadow: 0px 0px 14px rgba(0, 255, 102, 0.7);
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
        }

        /* Tarjetas con tamaño fijo y sin bordes aplastados */
        .card {
            background: rgba(16, 20, 26, 0.95);
            border: 2px solid #ff0055;
            animation: rgbBorde 10s linear infinite;
            border-radius: 14px;
            width: 140px;       
            height: 170px;      
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Contenedor de la imagen limpia al 100% */
        .image-container {
            width: 100%;
            height: 100%;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- El contenedor iniciará vacío y JS creará las 4 tarjetas fijas -->
    <div id="overlay-container"></div>

    <script>
        // Lista completa unificada con tus 14 imágenes GIF locales
        const listaGifs = [
            "1.gif", "2.gif", "3.gif", "4.gif", "5.gif", "6.gif", "7.gif",
            "8.gif", "9.gif", "10.gif", "11.gif", "12.gif", "13.gif", "14.gif"
        ];

        const container = document.getElementById('overlay-container');
        const totalColumnas = 4;
        let indiceBase = 0; // Controla qué GIF arranca en la primera tarjeta

        // 1. Crear la estructura fija de las 4 tarjetas en pantalla (completamente limpias)
        for (let i = 0; i < totalColumnas; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="image-container">
                    <img id="gif-col-${i}" src="" alt="Infectado">
                </div>
            `;
            container.appendChild(card);
        }

        // 2. Función para actualizar las imágenes de forma rotatoria
        function rotarImagenes() {
            for (let i = 0; i < totalColumnas; i++) {
                // Calcula el índice correspondiente del array asegurando que vuelva a 0 al pasar el 14
                const urlIndice = (indiceBase + i) % listaGifs.length;
                const imgElement = document.getElementById(`gif-col-${i}`);
                if (imgElement) {
                    imgElement.src = listaGifs[urlIndice];
                }
            }
            // Avanza el índice base para la siguiente rotación
            indiceBase = (indiceBase + 1) % listaGifs.length;
        }

        // 3. Ejecución inicial automática
        rotarImagenes();

        // 4. Intervalo de rotación: cambia el valor (5000 = 5 segundos) a tu gusto
        setInterval(rotarImagenes, 5000);
    </script>
</body>
</html>
