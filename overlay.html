<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay de Infectados Rotatorio - Local</title>
    <style>
        /* Fondo transparente e ideal para transmisiones verticales (9:16) */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR DE 4 COLUMNAS EN UNA SOLA FILA HORIZONTAL */
        #overlay-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: nowrap;   
            gap: 12px;          
            padding: 10px;
            justify-content: center;
            align-items: center;
            width: auto;        
            box-sizing: border-box;
        }

        /* ANIMACIÓN PARA QUE LOS BORDES RGB CAMBIEN SUAVEMENTE */
        @keyframes rgbBorde {
            0% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
            25% {
                border-color: #a000ff;
                box-shadow: 0px 0px 14px rgba(160, 0, 255, 0.7);
            }
            50% {
                border-color: #00e5ff;
                box-shadow: 0px 0px 14px rgba(0, 229, 255, 0.7);
            }
            75% {
                border-color: #00ff66;
                box-shadow: 0px 0px 14px rgba(0, 255, 102, 0.7);
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
        }

        /* Tarjetas blindadas contra deformaciones en TikTok */
        .card {
            background: rgba(16, 20, 26, 0.95);
            border: 2px solid #ff0055;
            animation: rgbBorde 10s linear infinite;
            border-radius: 14px;
            width: 140px;       
            height: 170px;      
            flex-shrink: 0;     /* Evita que TikTok altere el tamaño original */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Contenedor de la imagen limpia al 100% */
        .image-container {
            width: 100%;
            height: 100%;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- El contenedor se genera vacío y JS insertará las 4 tarjetas fijas -->
    <div id="overlay-container"></div>

    <script>
        // Genera automáticamente la lista enlazada local del 1.gif al 14.gif
        const listaGifs = [];
        for (let i = 1; i <= 14; i++) {
            listaGifs.push(`${i}.gif`);
        }

        const container = document.getElementById('overlay-container');
        const totalColumnas = 4;
        let indiceBase = 0; // Controla el primer GIF visible de la tanda

        // 1. Inyectar la estructura fija de las 4 tarjetas limpias en el HTML
        for (let i = 0; i < totalColumnas; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="image-container">
                    <img id="gif-col-${i}" src="" alt="Infectado">
                </div>
            `;
            container.appendChild(card);
        }

        // 2. Función lógica para cambiar los archivos locales y reiniciar en bucle
        function rotarImagenes() {
            for (let i = 0; i < totalColumnas; i++) {
                // El operador % asegura que al pasar del GIF 14 regrese al 1 automáticamente
                const urlIndice = (indiceBase + i) % listaGifs.length;
                const imgElement = document.getElementById(`gif-col-${i}`);
                if (imgElement) {
                    imgElement.src = listaGifs[urlIndice];
                }
            }
            // Avanza el bloque para la siguiente transición
            indiceBase = (indiceBase + 1) % listaGifs.length;
        }

        // 3. Carga inmediata de las primeras imágenes al abrir el archivo local
        rotarImagenes();

        // 4. Temporizador de rotación automática (5000 = cada 5 segundos)
        setInterval(rotarImagenes, 5000);
    </script>
</body>
</html>
