<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay L4D - TikTok Studio</title>
    <style>
        /* Base limpia y transparente para el stream */
        body { 
            margin: 0; padding: 0; background: transparent; 
            width: 100vw; height: 100vh; display: flex; 
            justify-content: center; align-items: center; font-family: Arial, sans-serif; 
            box-sizing: border-box; overflow: hidden;
        }

        /* Contenedor responsivo para TikTok Studio (Horizontal y Vertical) */
        #overlay-container { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, max-content));
            justify-content: center; align-content: center;
            gap: 40px 30px; padding: 50px 30px; width: 100%; height: 100%; box-sizing: border-box;
            opacity: 1;
        }

        /* Tarjeta */
        .card { 
            background: rgba(10,12,16,0.85); border-radius: 12px; 
            width: 210px; height: 340px; position: relative; 
            overflow: visible; display: flex; flex-direction: column; 
            border: 2px solid #ffffff; 
        }

        .img-box { width: 100%; height: 100%; position: absolute; border-radius: 10px; overflow: hidden; z-index: 1; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.1); }
        .esq-izq { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; overflow: visible; pointer-events: none; }

        /* Contenedor de regalos */
        .gift-box { 
            position: absolute; top: -35px; left: -25px; 
            display: flex; gap: 8px; align-items: center; z-index: 20; 
            background: rgba(0, 0, 0, 0.4); padding: 4px 8px; border-radius: 20px; backdrop-filter: blur(2px);
        }

        .tiktok-gift { position: relative; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; }
        .gift-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); }

        .tap-tap-texto { 
            position: absolute; top: 34px !important; left: 0; right: 0; 
            text-align: center; font-family: 'Arial Black', Impact, sans-serif; 
            font-size: 10px; font-weight: 900; color: #fff300; 
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000; 
        }

        /* Ajustes para pantalla vertical de TikTok Live Studio */
        @media (max-width: 750px) or (orientation: portrait) {
            #overlay-container { grid-template-columns: repeat(2, minmax(140px, 160px)); gap: 35px 20px; padding: 40px 15px; }
            .card { width: 100%; height: 250px; }
            .gift-box { transform: scale(0.75); top: -25px !important; left: -15px !important; }
        }
    </style>
</head>
<body>

    <div id="overlay-container"></div>

    <script>
        const bloques = [
            [
                { 
                    g: "1.gif", 
                    i: "regalos/azul.webp", 
                    gifts: ["regalos/azul.webp", "regalos/seguir.webp"],
                    text: ["TAP TAP", "SEGUIR"] 
                },
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] },   
                { g: "3.gif", i: "regalos/blanca.webp", gifts: [] }, 
                { g: "4.gif", i: "regalos/tiktok.webp", gifts: [] }
            ],
            [
                { g: "5.gif", i: "regalos/gg.webp", gifts: [] }, 
                { g: "6.gif", i: "regalos/coreano.webp", gifts: [] }, 
                { g: "7.gif", i: "regalos/rose.webp", gifts: [] }, 
                { g: "8.gif", i: "regalos/rosquilla.webp", gifts: [] } 
            ],
            [
                { g: "9.gif", i: "regalos/gafas.webp", gifts: [] },    
                { g: "10.gif", i: "regalos/confetti.webp", gifts: [] }, 
                { g: "11.gif", i: "regalos/helado.webp", gifts: [] },   
                { g: "12.gif", i: "regalos/perfume.webp", gifts: [] }   
            ],
            [
                { g: "13.gif", i: "regalos/gorra.webp", gifts: [] }, 
                { g: "14.gif", i: "regalos/osito.webp", gifts: [] }, 
                { 
                    g: "1.gif", /* CORREGIDO: Ahora usa '1.gif' para renderizar la animación correctamente en esta posición */
                    i: "regalos/azul.webp", 
                    gifts: ["regalos/azul.webp", "regalos/seguir.webp"],
                    text: ["TAP TAP", "SEGUIR"] 
                },
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] }               
            ]
        ];

        let bloqueActual = 0;
        const contenedor = document.getElementById("overlay-container");

        // Motor de descarga previa para evitar desajustes visuales
        function precargarImagenes(listaUrls) {
            return Promise.all(listaUrls.map(url => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = url;
                    img.onload = resolve;
                    img.onerror = resolve; 
                });
            }));
        }

        async function cambiarBloque() {
            try {
                const datosBloque = bloques[bloqueActual];
                const urlsAPrecargar = [];
                
                datosBloque.forEach(tarjeta => {
                    if (tarjeta.g) urlsAPrecargar.push(tarjeta.g);
                    if (tarjeta.gifts && tarjeta.gifts.length > 0) {
                        tarjeta.gifts.forEach(u => urlsAPrecargar.push(u));
                    } else if (tarjeta.i) {
                        urlsAPrecargar.push(tarjeta.i);
                    }
                });

                // Descarga todo en segundo plano sin ocultar el contenedor actual
                await precargarImagenes(urlsAPrecargar);

                // Construcción de la nueva interfaz en memoria limpia
                let nuevoHTML = "";
                datosBloque.forEach(tarjeta => {
                    const listaGifts = (tarjeta.gifts && tarjeta.gifts.length > 0) ? tarjeta.gifts : [tarjeta.i];
                    
                    let regalosHTML = "";
                    listaGifts.forEach((ruta, index) => {
                        if (!ruta) return;
                        
                        let nombreTexto = "";
                        
                        if (tarjeta.text && tarjeta.text[index]) {
                            nombreTexto = tarjeta.text[index];
                        } else {
                            const nombreArchivo = ruta.split('/').pop();
                            nombreTexto = (nombreArchivo && nombreArchivo.includes('.')) ? nombreArchivo.split('.')[0].toUpperCase() : "REGALO";
                        }

                        regalosHTML += `
                            <div class="tiktok-gift">
                                <img class="gift-img" src="${ruta}" alt="Regalo">
                                <div class="tap-tap-texto">${nombreTexto}</div>
                            </div>
                        `;
                    });

                    nuevoHTML += `
                        <div class="card">
                            <div class="img-box">
                                <img src="${tarjeta.g}" alt="Fondo">
                            </div>
                            <div class="esq-izq">
                                <div class="gift-box">
                                    ${regalosHTML}
                                </div>
                            </div>
                        </div>
                    `;
                });

                // INTERCAMBIO INSTANTÁNEO: Sin animaciones de opacidad intermedias para erradicar parpadeos
                contenedor.innerHTML = nuevoHTML;
                
                // Avanza cíclicamente al siguiente bloque
                bloqueActual = (bloqueActual + 1) % bloques.length;

            } catch (error) {
                console.error("Error en la transición suave del overlay:", error);
            }
        }

        // Carga inicial directa
        cambiarBloque();
        
        // Rotación continua cada 8 segundos para mantener un ritmo dinámico en el stream
        setInterval(cambiarBloque, 8000);
    </script>
</body>
</html>
