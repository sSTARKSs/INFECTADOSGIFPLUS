<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay L4D Horizontal - TikTok Studio Edition Premium</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
/* CENTRADO MAESTRO ABSOLUTE EN PANTALLA COMPLETA VERTICAL (TIKTOK STUDIO) */
html, body { 
    margin: 0 !important; 
    padding: 0 !important;
    background: transparent !important; 
    overflow: hidden !important; 
    width: 100vw !important; 
    height: 100vh !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    font-family: 'Bebas Neue', sans-serif !important; 
}

/* CONTENEDOR MAESTRO HORIZONTAL ADAPTADO CON TRADUCCIÓN NATIVA DE GPU */
#overlay-container { 
    display: flex !important; 
    gap: 0.6cm !important; 
    justify-content: center !important; 
    align-items: flex-start !important; 
    box-sizing: border-box !important; 
    width: 6400px !important; 
    height: 2400px !important;
    transform: scale(0.15) translate3d(0,0,0) !important; 
    transform-origin: center center !important;
    margin: 0 auto !important;
}

/* BLOQUES AL BORDE HORIZONTAL */
.bloque-heroes, .bloque-villanos { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    gap: 0px !important; 
    margin: 0 !important;
    padding: 0 !important;
}

/* CUADRÍCULAS CON ESPACIADO FLUIDO PARA OBS / TIKTOK STUDIO */
.cuadrilla-heroes { 
    display: grid !important; 
    grid-template-columns: repeat(2, 540px) !important; 
    grid-template-rows: repeat(3, 680px) !important; 
    gap: 16px 16px !important; 
}
.cuadrilla-villanos { 
    display: grid !important; 
    grid-template-columns: repeat(7, 540px) !important; 
    grid-template-rows: repeat(3, 680px) !important; 
    gap: 16px 16px !important; 
}

/* CONFIGURACIÓN ANCHA EXCLUSIVA PARA LAS TARJETAS MÚLTIPLES MARCADAS */
.cuadrilla-villanos .c-11,
.cuadrilla-villanos .c-14,
.cuadrilla-villanos .c-16,
.cuadrilla-villanos .c-17 {
    grid-column: span 2 !important; 
    width: 1096px !important; 
}

/* REAJUSTE DE CONTENEDORES INTERNOS EN TARJETAS EXTENDIDAS */
.c-11 .svg-wrapper-top, .c-14 .svg-wrapper-top, .c-16 .svg-wrapper-top, .c-17 .svg-wrapper-top { width: 1085px !important; }
.c-11 .svg-wrapper-bottom, .c-14 .svg-wrapper-bottom, .c-16 .svg-wrapper-bottom, .c-17 .svg-wrapper-bottom { width: 1085px !important; }

/* CABECERAS VECTORIALES */
.svg-wrapper-title-heroes { width: 1080px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 0 -10px 0 !important; }
.svg-wrapper-title-villanos { width: 3780px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 0 -10px 0 !important; }

/* MARCADORES INTERNOS */
.svg-wrapper-top { position: absolute !important; top: -15px !important; left: -15px !important; width: 545px !important; height: 160px !important; z-index: 45 !important; pointer-events: none !important; }
.svg-wrapper-bottom { position: absolute !important; bottom: -15px !important; left: -15px !important; width: 545px !important; height: 320px !important; z-index: 45 !important; pointer-events: none !important; }

/* TEXTO DE LA WITCH EN LA ESQUINA SUPERIOR DERECHA ABSOLUTA */
.texto-witch-premium {
    position: absolute !important;
    top: 30px !important;
    right: 35px !important;
    font-family: 'Bebas Neue', sans-serif !important;
    font-size: 75px !important;
    font-style: italic !important;
    font-weight: 700 !important;
    color: #ffffff !important;
    text-shadow: 3px 3px 0px #040508, -3px -3px 0px #040508, 3px -3px 0px #040508, -3px 3px 0px #040508 !important;
    z-index: 50 !important;
    pointer-events: none !important;
}

/* ANIMACIÓN LINEAL DE PULSO MAESTRO QUANTUM (BAJO CONSUMO GPU) */
@keyframes pulso-quantum {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* BASE DE LA TARJETA CON MARCO DE FIBRA ÓPTICA ANIMADA */
.card { 
    position: relative !important; 
    box-sizing: border-box !important; 
    overflow: visible !important;
    backface-visibility: hidden !important;
    -webkit-backface-visibility: hidden !important;
    transform: translateZ(0) !important; 
    will-change: transform !important;
    background: #040508 !important;
}

/* SUBPANEL DE ENERGÍA FLUIDA SUTIL SIN SATURACIÓN */
.card::before {
    content: '' !important;
    position: absolute !important;
    top: -4px !important;
    left: -4px !important;
    right: -4px !important;
    bottom: -4px !important;
    z-index: -1 !important;
    background-size: 200% 200% !important; 
    animation: pulso-quantum 4s ease infinite !important; 
}

/* PULSO CYBER JADE EN HÉROES */
.cuadrilla-heroes .card::before { background-image: linear-gradient(270deg, #00ff88, #014d25, #00ff88) !important; }

/* PULSO LÁSER RUBÍ EN VILLANOS */
.cuadrilla-villanos .card::before { background-image: linear-gradient(270deg, #ff003c, #4d0012, #ff003c) !important; }

/* CORTES DE MONTAJE DEL BISEL */
.cuadrilla-heroes .card { clip-path: polygon(12% 0%, 100% 0%, 100% 88%, 88% 100%, 0% 100%, 0% 12%) !important; }
.cuadrilla-villanos .card { clip-path: polygon(0% 0%, 88% 0%, 100% 12%, 100% 100%, 12% 100%, 0% 88%) !important; }
.cuadrilla-villanos .c-11, .cuadrilla-villanos .c-14, .cuadrilla-villanos .c-16, .cuadrilla-villanos .c-17 {
    clip-path: polygon(0% 0%, 94% 0%, 100% 12%, 100% 100%, 6% 100%, 0% 88%) !important;
}

/* CONTENEDOR DE IMÁGENES NATIVAS */
.img-box { 
    position: absolute !important; 
    top: 3px !important; 
    left: 3px !important; 
    width: calc(100% - 6px) !important; 
    height: calc(100% - 6px) !important; 
    overflow: hidden !important; 
    z-index: 1 !important;
    background: #040508 !important;
}
.cuadrilla-heroes .img-box { clip-path: polygon(12% 0%, 100% 0%, 100% 88%, 88% 100%, 0% 100%, 0% 12%) !important; }
.cuadrilla-villanos .img-box { clip-path: polygon(0% 0%, 88% 0%, 100% 12%, 100% 100%, 12% 100%, 0% 88%) !important; }
.cuadrilla-villanos .c-11 .img-box, .cuadrilla-villanos .c-14 .img-box, .cuadrilla-villanos .c-16 .img-box, .cuadrilla-villanos .c-17 .img-box {
    clip-path: polygon(0% 0%, 94% 0%, 100% 12%, 100% 100%, 6% 100%, 0% 88%) !important;
}
.img-box img { width: 100% !important; height: 100% !important; object-fit: cover !important; opacity: 1.0 !important; }

/* CONTENEDOR DE REGALOS COMPACTO DE ALTA VISIBILIDAD (220x190px) */
.esq-der-regalo { 
    position: absolute !important; 
    bottom: 25px !important; 
    right: 25px !important; 
    width: 220px !important; 
    height: 190px !important; 
    background: rgba(200, 205, 215, 0.25) !important; 
    backdrop-filter: blur(15px) !important; 
    -webkit-backdrop-filter: blur(15px) !important;
    border: 2px solid rgba(255, 255, 255, 0.4) !important; 
    border-radius: 18px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    z-index: 20 !important; 
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
}
.esq-der-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; }

/* ROW HORIZONTAL PARA SEGUIRME A LA IZQUIERDA Y CORAZON AZUL A LA DERECHA */
.esq-der-doble { 
    position: absolute !important; 
    bottom: 25px !important; 
    right: 25px !important; 
    display: flex !important; 
    flex-direction: row !important; 
    align-items: center !important; 
    gap: 16px !important; 
    z-index: 20 !important; 
}

.sub-box-regalo { 
    width: 220px !important; 
    height: 190px !important; 
    background: rgba(200, 205, 215, 0.25) !important; 
    backdrop-filter: blur(15px) !important; 
    -webkit-backdrop-filter: blur(15px) !important;
    border: 2px solid rgba(255, 255, 255, 0.4) !important; 
    border-radius: 18px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    position: relative; 
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
}
.sub-box-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; }

/* TEXTOS INTERNOS */
.texto-seguir-interno { position: absolute !important; top: 6px !important; left: 50% !important; transform: translateX(-50%) !important; font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 700; color: #ffffff; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000 !important; white-space: nowrap; z-index: 25; text-align: center; }
.texto-taptap-interno { position: absolute !important; top: 6px !important; left: 50% !important; transform: translateX(-50%) !important; font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 700; color: #ffffff; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000 !important; white-space: nowrap; z-index: 25; text-align: center; }
</style>
</head>

<script>
function drawSvgBottomVillano(texto) {
    let textoLimpio = String(texto).trim();
    let palabras = textoLimpio.split(/\s+/);
    let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 540 280">`;
    
    if (palabras.length > 1) {
        let palabrasInvertivas = palabras.slice().reverse();
        for (let i = 0; i < palabrasInvertivas.length; i++) {
            let posY = 240 - (i * 48);
            htmlSvg += `<text x="25" y="${posY}" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="42px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill">${palabrasInvertivas[i]}</text>`;
        }
    } else {
        htmlSvg += `<text x="25" y="240" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="58px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="11" stroke-linejoin="round" paint-order="stroke fill">${textoLimpio}</text>`;
    }
    return htmlSvg + `</svg>`;
}

function generarTarjetaHTML(t) {
    let esTarjetaAncha = (t.c === "c-11" || t.c === "c-14" || t.c === "c-16" || t.c === "c-17");
    let anchoEstilo = esTarjetaAncha ? 'width: 1096px !important;' : 'width: 540px !important;';
    let html = `<div class="card ${t.c}" style="${anchoEstilo} height: 680px !important;">`; 
    
    if (t.esWitch) {
        html += `<div class="texto-witch-premium">WITCH</div>`;
    }
    
    if (t.mult) {
        html += drawSvgTop(t.mult);
    }
    html += `<div class="img-box"><img src="${t.g}" alt="Icono"></div>`;
    
    if (t.esHeroe) {
        html += drawSvgBottomHeroeManual(t.id);
    } else if (t.infNombre) {
        if (esTarjetaAncha) {
            let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 1080 280">`;
            if (t.infNombre === "INCAPACITAR SUPERVIVIENTES") {
                htmlSvg += `<text x="35" y="240" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">SUPERVIVIENTES</text>`;
                htmlSvg += `<text x="35" y="190" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">INCAPACITAR</text>`;
            } else if (t.infNombre === "ELIMINAR SUPERVIVIENTES") {
                htmlSvg += `<text x="35" y="240" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">SUPERVIVIENTES</text>`;
                htmlSvg += `<text x="35" y="190" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">ELIMINAR</text>`;
            } else {
                let textoLimpio = String(t.infNombre).trim();
                let palabras = textoLimpio.split(/\s+/);
                let palabrasInvertivas = palabras.slice().reverse();
                for (let i = 0; i < palabrasInvertivas.length; i++) {
                    let posY = 240 - (i * 48);
                    htmlSvg += `<text x="35" y="${posY}" font-family="'Bebas Neue', sans-serif" font-weight="700" font-size="50px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#040508" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">${palabrasInvertivas[i]}</text>`;
                }
            }
            html += htmlSvg + `</svg>`;
        } else {
            html += drawSvgBottomVillano(t.infNombre);
        }
    }
    
    if (t.dobleGift) {
        html += `<div class="esq-der-doble">` +
                    `<div class="sub-box-regalo">` +
                        `<div class="texto-seguir-interno">SEGUIRME</div>` +
                        `<img src="regalos/${REGALOS.SEGUIR}" alt="Seguir">` +
                    `</div>` +
                    `<div class="sub-box-regalo">` +
                        `<div class="texto-taptap-interno">TAP TAP</div>` + 
                        `<img src="regalos/${REGALOS.CORAZON_AZUL}" alt="Azul">` +
                    `</div>` +
                `</div>`;
    } else if (t.gift && REGALOS[t.gift]) {
        html += `<div class="esq-der-regalo"><img src="regalos/${REGALOS[t.gift]}" alt="Regalo"></div>`;
    }
    return html + `</div>`;
}

if (container) {
    let estructuraFinal = `<div class="bloque-heroes">${drawSvgTitleHeroes()}<div class="cuadrilla-heroes">`;
    tarjetasHeroes.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    estructuraFinal += `</div></div><div class="bloque-villanos">${drawSvgTitleVillanos()}<div class="cuadrilla-villanos">`;
    tarjetasVillanos.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    container.innerHTML = estructuraFinal + `</div></div>`;
}
</script>
</body>
</html>
