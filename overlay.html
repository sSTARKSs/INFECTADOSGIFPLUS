<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay de Infectados - 14 GIFs Rotativos Secuenciales</title>
    <style>
        /* Fondo transparente e ideal para transmisiones verticales (9:16) */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR DE 4 COLUMNAS EN UNA SOLA FILA HORIZONTAL SIMÉTRICA */
        #overlay-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: nowrap;   
            gap: 14px;          
            padding: 10px;
            justify-content: center;
            align-items: center;
            width: auto;        
            box-sizing: border-box;
        }

        /* ANIMACIÓN PARA QUE LOS BORDES RGB CAMBIEN SUAVEMENTE */
        @keyframes rgbBorde {
            0% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
            25% {
                border-color: #a000ff;
                box-shadow: 0px 0px 14px rgba(160, 0, 255, 0.7);
            }
            50% {
                border-color: #00e5ff;
                box-shadow: 0px 0px 14px rgba(0, 229, 255, 0.7);
            }
            75% {
                border-color: #00ff66;
                box-shadow: 0px 0px 14px rgba(0, 255, 102, 0.7);
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0px 0px 14px rgba(255, 0, 85, 0.7);
            }
        }

        /* TARJETAS CON TAMAÑO IDÉNTICO, PROHIBIDO DEFORMARSE */
        .card {
            background: rgba(16, 20, 26, 0.95);
            border: 2px solid #ff0055;
            animation: rgbBorde 10s linear infinite;
            border-radius: 16px; 
            width: 170px;        
            height: 250px;       
            flex-shrink: 0;      
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Contenedor de la imagen limpia al 100% */
        .image-container {
            width: 100%;
            height: 100%;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <!-- El contenedor se genera vacío y JS insertará las 4 tarjetas fijas -->
    <div id="overlay-container"></div>

    <script>
        // Lista exacta de tus 14 imágenes locales
        const listaGifs = [];
        for (let i = 1; i <= 14; i++) {
            listaGifs.push(`${i}.gif`);
        }

        const container = document.getElementById('overlay-container');
        const totalColumnas = 4;
        let indiceBase = 0; // Controla la posición inicial de la cola global

        // 1. Inyectar la estructura de las 4 tarjetas idénticas en el HTML
        for (let i = 0; i < totalColumnas; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="image-container">
                    <img id="gif-col-${i}" src="" alt="Infectado">
                </div>
            `;
            container.appendChild(card);
        }

        // 2. Función de rotación secuencial estricta sin repetición por bloque
        function rotarBloqueCompleto() {
            for (let i = 0; i < totalColumnas; i++) {
                // El operador matemático % mantiene el índice dentro de los 14 elementos sin romper la fila
                const urlIndice = (indiceBase + i) % listaGifs.length;
                const imgElement = document.getElementById(`gif-col-${i}`);
                if (imgElement) {
                    imgElement.src = listaGifs[urlIndice];
                }
            }

            // Desplaza la cola 4 posiciones hacia adelante para el siguiente grupo entero
            indiceBase = (indiceBase + totalColumnas) % listaGifs.length;
        }

        // 3. Carga inmediata del primer bloque al abrir la escena
        rotarBloqueCompleto();

        // 4. Temporizador de rotación por bloques de 8 segundos (8000ms)
        setInterval(rotarBloqueCompleto, 8000);
    </script>
</body>
</html>
