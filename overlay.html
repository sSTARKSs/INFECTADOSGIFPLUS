<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay L4D - TikTok Studio</title>
    <style>
        /* Base limpia y transparente para el stream */
        body { 
            margin: 0; padding: 0; background: transparent; 
            width: 100vw; height: 100vh; display: flex; 
            justify-content: center; align-items: center; font-family: Arial, sans-serif; 
            box-sizing: border-box; overflow: hidden;
        }

        /* Contenedor responsivo para TikTok Studio (Horizontal y Vertical) */
        #overlay-container { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, max-content));
            justify-content: center; align-content: center;
            gap: 40px 30px; padding: 50px 30px; width: 100%; height: 100%; box-sizing: border-box;
            opacity: 1;
        }

        /* Tarjeta base con Borde RGB Animado Tradicional (Máxima compatibilidad) */
        .card { 
            background: rgba(10,12,16,0.85); 
            border-radius: 12px; 
            width: 210px; 
            height: 340px; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
            z-index: 1;
        }

        /* Pseudo-elemento para el borde animado compatible con cualquier navegador/OBS */
        .card::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, #ff0000, #ff7700, #ffea00, #00ff00, #00ffff, #0000ff, #9900ff, #ff00ff);
            background-size: 400% 400%;
            border-radius: 15px;
            z-index: -1;
            animation: rgbMove 4s ease infinite;
        }

        /* Animación fluida de gradiente */
        @keyframes rgbMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .img-box { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            border-radius: 9px; 
            overflow: hidden; 
            z-index: 1;
            top: 0;
            left: 0;
        }
        
        .img-box img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.1); }
        .esq-izq { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; overflow: visible; pointer-events: none; }

        /* Contenedor de regalos reposicionado para el tamaño grande de 100px */
        .gift-box { 
            position: absolute; 
            top: -55px;               /* Subido para que el regalo grande no tape la tarjeta */
            left: -35px;              /* Desplazado a la izquierda para balancear el diseño */
            display: flex; 
            gap: 12px; 
            align-items: center; 
            z-index: 20; 
            background: rgba(0, 0, 0, 0.5); 
            padding: 6px 12px; 
            border-radius: 25px; 
            backdrop-filter: blur(2px);
        }

        /* TAMAÑO DE LOS REGALOS .WEBP INCREMENTADO A 100PX (Doble de grande que antes) */
        .tiktok-gift { 
            position: relative; 
            width: 100px;             
            height: 100px;            
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .gift-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); }

        /* Texto adaptado para quedar justo abajo del regalo de 100px */
        .tap-tap-texto { 
            position: absolute; 
            top: 76px !important;     /* Ajustado abajo del regalo grande */
            left: -10px; 
            right: -10px; 
            text-align: center; 
            font-family: 'Arial Black', Impact, sans-serif; 
            font-size: 12px;          /* Texto más legible en móviles */
            font-weight: 900; 
            color: #fff300; 
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000; 
        }

        /* Ajustes para pantalla vertical de TikTok Live Studio */
        @media (max-width: 750px) or (orientation: portrait) {
            #overlay-container { grid-template-columns: repeat(2, minmax(140px, 160px)); gap: 35px 20px; padding: 40px 15px; }
            .card { width: 100%; height: 250px; }
            .gift-box { transform: scale(0.75); top: -35px !important; left: -20px !important; }
        }
    </style>
</head>
<body>

    <div id="overlay-container"></div>

    <script>
        const bloques = [
            [
                { 
                    g: "1.gif", 
                    i: "regalos/azul.webp", 
                    gifts: ["regalos/azul.webp", "regalos/seguir.webp"],
                    text: ["TAP TAP", "SEGUIR"] 
                },
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] },   
                { g: "3.gif", i: "regalos/blanca.webp", gifts: [] }, 
                { g: "4.gif", i: "regalos/tiktok.webp", gifts: [] }
            ],
            [
                { g: "5.gif", i: "regalos/gg.webp", gifts: [] }, 
                { g: "6.gif", i: "regalos/coreano.webp", gifts: [] }, 
                { g: "7.gif", i: "regalos/rose.webp", gifts: [] }, 
                { g: "8.gif", i: "regalos/rosquilla.webp", gifts: [] } 
            ],
            [
                { g: "9.gif", i: "regalos/gafas.webp", gifts: [] },    
                { g: "10.gif", i: "regalos/confetti.webp", gifts: [] }, 
                { g: "11.gif", i: "regalos/helado.webp", gifts: [] },   
                { g: "12.gif", i: "regalos/perfume.webp", gifts: [] }   
            ],
            [
                { g: "13.gif", i: "regalos/gorra.webp", gifts: [] }, 
                { g: "14.gif", i: "regalos/osito.webp", gifts: [] }, 
                { g: "1.gif", i: "regalos/azul.webp", gifts: ["regalos/azul.webp", "regalos/seguir.webp"],
                    text: ["TAP TAP", "SEGUIR"] },
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] }               
            ]
        ];

        let bloqueActual = 0;
        const contenedor = document.getElementById("overlay-container");

        function cambiarBloque() {
            try {
                const datosBloque = bloques[bloqueActual];
                let nuevoHTML = "";

                datosBloque.forEach((tarjeta, cardIndex) => {
                    const listaGifts = (tarjeta.gifts && tarjeta.gifts.length > 0) ? tarjeta.gifts : [tarjeta.i];
                    
                    let regalosHTML = "";
                    listaGifts.forEach((ruta, index) => {
                        if (!ruta) return;
                        
                        let nombreTexto = "";
                        
                        if (tarjeta.text && tarjeta.text[index]) {
                            nombreTexto = tarjeta.text[index];
                        } else {
                            const nombreArchivo = ruta.split('/').pop();
                            nombreTexto = (nombreArchivo && nombreArchivo.includes('.')) ? nombreArchivo.split('.')[0].toUpperCase() : "REGALO";
                        }

                        regalosHTML += `
                            <div class="tiktok-gift">
                                <img class="gift-img" src="${ruta}" alt="Regalo">
                                <div class="tap-tap-texto">${nombreTexto}</div>
                            </div>
                        `;
                    });

                    const delayNegativo = -(cardIndex * 1); 

                    nuevoHTML += `
                        <div class="card" style="animation-delay: ${delayNegativo}s;">
                            <div class="img-box">
                                <img src="${tarjeta.g}" alt="Fondo">
                            </div>
                            <div class="esq-izq">
                                <div class="gift-box">
                                    ${regalosHTML}
                                </div>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML = nuevoHTML;
                bloqueActual = (bloqueActual + 1) % bloques.length;

            } catch (error) {
                console.error("Error al renderizar el bloque del overlay:", error);
            }
        }

        // Carga inmediata sin esperar precarga de red externa
        cambiarBloque();
        setInterval(cambiarBloque, 8000);
    </script>
</body>
</html>
