<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Overlay L4D - TikTok Studio</title>
    <style>
        body { margin:0; padding:0; background:transparent; overflow:hidden; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; font-family:Arial,sans-serif; }
        
        #overlay-container { 
            display:flex; flex-direction:row; justify-content:center; align-items:center; gap:25px; padding:25px; max-width:100%; max-height:100%; box-sizing:border-box; position:relative;
        }
        
        /* Contenedor de ranura fija para mantener el espacio físico de cada una de las 4 posiciones */
        .slot-posicion {
            width: 210px; height: 340px; position: relative; overflow: visible; display: flex; justify-content: center; align-items: center;
        }

        /* Las tarjetas ahora usan transiciones de opacidad ultra fluidas y se apilan perfectamente */
        .card { 
            background:rgba(10,12,16,0.85); border-radius:12px; width:100%; height:100%; position:absolute; top:0; left:0; overflow:visible; display:flex; flex-direction:column; border:2px solid #ffffff; 
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in-out; box-sizing:border-box; z-index: 1;
        }
        
        /* Clase activa que muestra el bloque actual de golpe sin esperas */
        .card.activa {
            opacity: 1; pointer-events: auto; z-index: 5;
        }

        .img-box { width:100%; height:100%; position:absolute; border-radius:10px; overflow:hidden; z-index:1; }
        .img-box img { width:100%; height:100%; object-fit:cover; filter:brightness(0.75) contrast(1.1); }
        .esq-izq { position:absolute; top:0; left:0; width:100%; height:100%; z-index:10; overflow:visible; pointer-events:none; }
        
        .icon-container-flotante { position:absolute; top:-48px; left:-30px; display:flex; gap:8px; overflow:visible; }
        .img-icon-flotante { width:68px; height:68px; filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.6)); position:relative; }
        .icon-especial-0 { width:72px; height:72px; filter:drop-shadow(2px 4px 6px #000); }
        
        .gift-box { position:absolute; top:-48px; left:-30px; display:flex; gap:6px; align-items:center; z-index:20; }
        .tiktok-gift { position:relative; width:56px; height:56px; display:flex; justify-content:center; align-items:center; }
        .gift-img { width:56px; height:56px; object-fit:contain; filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.6)); }
        .tap-tap-texto { position:absolute; top:36px!important; left:0; right:0; text-align:center; font-family:'Arial Black',Impact,sans-serif; font-size:11px; font-weight:900; color:#fff300; text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 10px #fff300; white-space:nowrap; z-index:35; letter-spacing:-0.3px; }
        
        /* Ajuste responsivo vertical para el Stream de TikTok */
        @media (max-width:768px) or (orientation:portrait) {
            #overlay-container { flex-direction:column; gap:55px; padding:60px 10px; }
            .slot-posicion { width:140px; height:185px; }
            .icon-container-flotante, .gift-box { transform:scale(0.75); transform-origin:top left; }
        }
    </style>
</head>
<body>
    <div id="overlay-container"></div>
    <script>
        const container = document.getElementById('overlay-container'); 
        let bloqueActual = 0;

        const estilosFijos = [{c:'#ca1aff',s:'rgba(202,26,255,0.7)'},{c:'#ff0050',s:'rgba(255,0,80,0.7)'},{c:'#ffffff',s:'rgba(255,255,255,0.9)'},{c:'#ff00aa',s:'rgba(255,0,170,0.7)'}];
        const coloresRGBTarjeta3 = [{c:'#ffffff',s:'rgba(255,255,255,0.9)'},{c:'#ffcc00',s:'rgba(255,204,0,0.7)'},{c:'#00e5ff',s:'rgba(0,229,255,0.7)'},{c:'#00ff66',s:'rgba(0,255,102,0.7)'}];

        const REGALOS_TIKTOK = {
            "SEGUIR": { imagen: "regalos/seguir.webp" },
            "CORAZON_AZUL": { imagen: "regalos/azul.webp", conTexto: true }, 
            "ROSA_1M": { imagen: "regalos/rosa.webp" },   
            "ROSA_BLANCA_METAL": { imagen: "regalos/blanca.webp" } 
        };

        const bloques = [
            [
                { g: "1.gif", i: ["regalos/azul.webp", "regalos/seguir.webp"], gifts: [] },
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] },   
                { g: "3.gif", i: "regalos/blanca.webp", gifts: [] }, 
                { g: "4.gif", i: "regalos/tiktok.webp", gifts: [] }
            ],
            [
                { g: "5.gif", i: "regalos/gg.webp", gifts: [] }, 
                { g: "6.gif", i: "regalos/coreano.webp", gifts: [] }, 
                { g: "7.gif", i: "regalos/rose.webp", gifts: [] }, 
                { g: "8.gif", i: "regalos/rosquilla.webp", gifts: [] } 
            ],
            [
                { g: "9.gif", i: "regalos/gafas.webp", gifts: [] },    
                { g: "10.gif", i: "regalos/confetti.webp", gifts: [] }, 
                { g: "11.gif", i: "regalos/helado.webp", gifts: [] },   
                { g: "12.gif", i: "regalos/perfume.webp", gifts: [] }   
            ],
            [
                { g: "13.gif", i: "regalos/gorra.webp", gifts: [] }, 
                { g: "14.gif", i: "regalos/osito.webp", gifts: [] }, 
                { g: "1.gif", i: ["regalos/azul.webp", "regalos/seguir.webp"], gifts: [] },       
                { g: "2.gif", i: "regalos/rosa.webp", gifts: [] }               
            ]
        ];

        // 1. GENERAR ESTRUCTURA INICIAL DE RANURAS FÍSICAS (4 Posiciones en pantalla)
        for (let i = 0; i < 4; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot-posicion';
            slot.id = `slot-${i}`;
            container.appendChild(slot);
        }

        // 2. CONSTRUIR TODAS LAS TARJETAS POSIBLES EN PARALELO DE ANTEMANO
        bloques.forEach((grupo, bIndex) => {
            for (let i = 0; i < 4; i++) {
                const slotDestino = document.getElementById(`slot-${i}`);
                const dataTarjeta = grupo[i];
                
                const card = document.createElement('div'); 
                card.className = `card card-bloque-${bIndex}`;
                
                // Aplicar estilo de color inicial fijo o dinámico para tarjeta 3
                let estilo = (i === 2) ? coloresRGBTarjeta3[bIndex] : estilosFijos[i];
                card.style.borderColor = estilo.c; 
                card.style.boxShadow = `0 0 18px ${estilo.s}, inset 0 0 10px ${estilo.s}`;

                // Construcción del HTML interno de la tarjeta
                let flotantesHtml = "";
                if (dataTarjeta.i) {
                    if (Array.isArray(dataTarjeta.i)) {
                        dataTarjeta.i.forEach((srcImg, idx) => {
                            let claseEspecial = (i === 0 && bIndex === 0 && idx === 0) ? 'icon-especial-0' : '';
                            flotantesHtml += `<img class="img-icon-flotante ${claseEspecial}" src="${srcImg}">`;
                        });
                    } else {
                        flotantesHtml += `<img class="img-icon-flotante" src="${dataTarjeta.i}">`;
                    }
                }

                let regalosHtml = "";
                dataTarjeta.gifts.forEach(k => {
                    if (REGALOS_TIKTOK[k]) {
                        let textoHtml = REGALOS_TIKTOK[k].conTexto ? `<div class="tap-tap-texto">TAP TAP</div>` : '';
                        regalosHtml += `<div class="tiktok-gift">${textoHtml}<img class="gift-img" src="${REGALOS_TIKTOK[k].imagen}"></div>`;
                    }
                });

                card.innerHTML = `
                    <div class="img-box"><img src="${dataTarjeta.g}"></div>
                    <div class="esq-izq">
                        <div class="gift-box">${regalosHtml}</div>
                        <div class="icon-container-flotante">${flotantesHtml}</div>
                    </div>
                `;
                
                slotDestino.appendChild(card);
            }
        });

        // 3. FUNCIÓN DE ROTACIÓN ULTRA RÁPIDA (Solo altera opacidades de tarjetas pre-renderizadas)
        function rotarSincronizado() {
            // Ocultar todas las tarjetas que estén visibles en pantalla
            const todasLasTarjetas = document.querySelectorAll('.card');
            todasLasTarjetas.forEach(c => c.classList.remove('activa'));

            // Mostrar instantáneamente las 4 tarjetas pertenecientes al bloque actual
            const tarjetasNuevas = document.querySelectorAll(`.card-bloque-${bloqueActual}`);
            tarjetasNuevas.forEach(c => c.classList.add('activa'));

            // Cambiar al siguiente índice de bloque de forma cíclica
            bloqueActual = (bloqueActual + 1) % bloques.length;
        }

        // Ejecución inmediata al cargar la escena local
        rotarSincronizado(); 
        setInterval(rotarSincronizado, 12000);
    </script>
</body>
</html>
