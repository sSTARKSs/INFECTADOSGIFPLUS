<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay de Infectados - Formato TikTok GIF</title>
    <style>
        /* Fondo transparente e ideal para transmisiones verticales (9:16) */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor compacto optimizado para el ancho de TikTok */
        #overlay-container {
            display: flex;
            gap: 10px;          /* Espacio original entre tarjetas */
            padding: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;        /* Se adapta al ancho vertical de TikTok */
            box-sizing: border-box;
        }

        /* ANIMACIÓN PARA QUE LOS BORDES CAMBIEN DE COLOR (RGB) */
        @keyframes rgbBorde {
            0% {
                border-color: #ff0055;
                box-shadow: 0px 0px 12px rgba(255, 0, 85, 0.6);
            }
            25% {
                border-color: #a000ff;
                box-shadow: 0px 0px 12px rgba(160, 0, 255, 0.6);
            }
            50% {
                border-color: #00e5ff;
                box-shadow: 0px 0px 12px rgba(0, 229, 255, 0.6);
            }
            75% {
                border-color: #00ff66;
                box-shadow: 0px 0px 12px rgba(0, 255, 102, 0.6);
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0px 0px 12px rgba(255, 0, 85, 0.6);
            }
        }

        /* Tarjetas con el tamaño original grande para que se vean perfectas */
        .card {
            background: rgba(16, 20, 26, 0.95);
            border: 2px solid #ff0055;
            animation: rgbBorde 10s linear infinite; /* Subido 2 segundos más para una transición más lenta */
            border-radius: 12px;
            width: 140px;       /* Ancho original grande */
            height: 170px;      /* Alto original grande */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* Contenedor de la imagen */
        .image-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Texto base para tarjetas 1 y 2 */
        .overlay-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .heart-icon {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="overlay-container">
        <!-- Tarjeta 1: Infectado Rose con corazón rojo -->
        <div class="card">
            <div class="image-container">
                <img src="https://giphy.com" alt="Infectado Rose">
                <div class="overlay-text">
                    <span>Rose</span>
                    <span class="heart-icon" style="color: #ff3b30;">❤️</span>
                </div>
            </div>
        </div>

        <!-- Tarjeta 2: Infectado Perfume con corazón morado -->
        <div class="card">
            <div class="image-container">
                <img src="https://giphy.com" alt="Infectado Perfume">
                <div class="overlay-text">
                    <span>Perfume</span>
                    <span class="heart-icon" style="color: #af52de;">💜</span>
                </div>
            </div>
        </div>

        <!-- Tarjeta 3: Imagen GIF del 3 (Limpia, sin texto ni corazón) -->
        <div class="card">
            <div class="image-container">
                <img src="https://giphy.com" alt="GIF 3">
            </div>
        </div>
    </div>

</body>
</html>
