<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay L4D Horizontal - Edición 4 Partes Final</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
/* CENTRADO MAESTRO ABSOLUTO EN PANTALLA COMPLETA */
html, body { 
    margin: 0 !important; 
    padding: 0 !important;
    background: transparent !important; 
    overflow: hidden !important; 
    width: 100vw !important; 
    height: 100vh !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    font-family: 'Oswald', 'Montserrat', sans-serif !important; 
}

/* CONTENEDOR MAESTRO - SEPARACIÓN EXACTA DE 1 CENTÍMETRO ENTRE GRUPOS */
#overlay-container { 
    display: flex !important; 
    gap: 1cm !important; 
    justify-content: center !important; 
    align-items: flex-start !important; 
    box-sizing: border-box !important; 
    width: 6400px !important; 
    height: 2400px !important;
    transform: scale(0.28) !important; 
    transform-origin: center center !important;
    margin: 0 auto !important;
}

/* BLOQUES AL BORDE */
.bloque-heroes, .bloque-villanos { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    gap: 0px !important; 
    margin: 0 !important;
    padding: 0 !important;
}

/* CUADRÍCULAS TOTALMENTE PEGADAS INTERNAMENTE (GAP 0px) */
.cuadrilla-heroes { 
    display: grid !important; 
    grid-template-columns: repeat(2, 540px) !important; 
    grid-template-rows: repeat(2, 680px) !important; 
    gap: 0px 0px !important; 
}
.cuadrilla-villanos { 
    display: grid !important; 
    grid-template-columns: repeat(7, 540px) !important; 
    grid-template-rows: repeat(3, 680px) !important; 
    gap: 0px 0px !important; 
}

/* CONFIGURACIÓN ANCHA EXCLUSIVA PARA LAS TARJETAS MÚLTIPLES MARCADAS (C-11, C-14, C-16 Y C-17) */
.cuadrilla-villanos .c-11,
.cuadrilla-villanos .c-14,
.cuadrilla-villanos .c-16,
.cuadrilla-villanos .c-17 {
    grid-column: span 2 !important; 
    width: 1080px !important; 
}

/* REAJUSTE DE CONTENEDORES INTERNOS EN TARJETAS EXTENDIDAS */
.c-11 .svg-wrapper-top, .c-14 .svg-wrapper-top, .c-16 .svg-wrapper-top, .c-17 .svg-wrapper-top {
    width: 1085px !important; 
}
.c-11 .svg-wrapper-bottom, .c-14 .svg-wrapper-bottom, .c-16 .svg-wrapper-bottom, .c-17 .svg-wrapper-bottom {
    width: 1085px !important; 
}

/* CABECERAS VECTORIALES */
.svg-wrapper-title-heroes { 
    width: 1080px !important; 
    height: 160px !important; 
    pointer-events: none !important; 
    display: block !important; 
    margin: 0 0 -20px 0 !important; 
}
.svg-wrapper-title-villanos { 
    width: 3780px !important; 
    height: 160px !important; 
    pointer-events: none !important; 
    display: block !important; 
    margin: 0 0 -20px 0 !important; 
}

/* MARCADORES INTERNOS ESTÁNDAR */
.svg-wrapper-top { position: absolute !important; top: -28px !important; left: -24px !important; width: 545px !important; height: 140px !important; z-index: 45 !important; pointer-events: none !important; }
.svg-wrapper-bottom { position: absolute !important; bottom: -22px !important; left: -24px !important; width: 545px !important; height: 280px !important; z-index: 45 !important; pointer-events: none !important; }

/* REFUERZO DE ESTILOS BASE DE LA TARJETA COMPACTA */
.card { 
    background: #0a0c10 !important; 
    border-radius: 0px !important; 
    position: relative !important; 
    box-sizing: border-box !important; 
    overflow: visible !important;
    box-shadow: none !important; 
    backface-visibility: hidden !important;
    -webkit-backface-visibility: hidden !important;
    transform: translate3d(0, 0, 0) !important;
    -webkit-transform: translate3d(0, 0, 0) !important;
    will-change: transform !important;
}

/* BORDES NEÓN DE FUSIÓN */
.cuadrilla-heroes .card { border: 4px solid #2aff2a !important; margin: 0px !important; }
.cuadrilla-villanos .card { border: 4px solid #ff2a2a !important; margin: 0px !important; }

/* CAJA DE IMÁGENES */
.img-box { 
    position: absolute !important; 
    top: 0 !important; 
    left: 0 !important; 
    width: 100% !important; 
    height: 100% !important; 
    border-radius: 0px !important; 
    overflow: hidden !important; 
    z-index: 1 !important;
}
.img-box img { width: 100% !important; height: 100% !important; object-fit: cover !important; }

/* RECUADROS DE REGALOS */
.esq-der-regalo { 
    position: absolute !important; 
    bottom: 30px !important; 
    right: 28px !important; 
    width: 180px !important; 
    height: 160px !important; 
    background: rgba(55, 65, 81, 0.45) !important; 
    backdrop-filter: blur(14px) !important; 
    -webkit-backdrop-filter: blur(14px) !important;
    border: 2.5px solid rgba(255, 255, 255, 0.38) !important; 
    border-radius: 26px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    z-index: 20 !important; 
    box-shadow: 0 12px 28px rgba(0,0,0,0.55), inset 0 2px 5px rgba(255,255,255,0.3) !important;
}
.esq-der-regalo img { width: 92% !important; height: 90% !important; object-fit: contain !important; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)) !important; }

.esq-der-doble { position: absolute !important; bottom: 30px !important; right: 28px !important; width: 182px !important; display: flex !important; flex-direction: column !important; align-items: center !important; gap: 12px !important; z-index: 20 !important; }

.sub-box-regalo { 
    width: 180px !important; 
    height: 160px !important; 
    background: rgba(55, 65, 81, 0.45) !important; 
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
    border: 2.5px solid rgba(255, 255, 255, 0.38) !important; 
    border-radius: 26px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    position: relative; 
    box-shadow: 0 12px 28px rgba(0,0,0,0.55), inset 0 2px 5px rgba(255,255,255,0.3) !important;
}
.sub-box-regalo img { width: 92% !important; height: 90% !important; object-fit: contain !important; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)) !important; }

.texto-seguir-interno { position: absolute !important; top: 6px !important; left: 50% !important; transform: translateX(-50%) !important; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; color: #ffffff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000 !important; white-space: nowrap; z-index: 25; letter-spacing: -0.2px; text-align: center; }
</style>
</head>
<body>

<div id="overlay-container"></div>

<script>
const container = document.getElementById('overlay-container');

const REGALOS = { 
    BOSQUE: "bosque.webp", CAPIBARA: "capibara.webp", CABEZA: "cabeza.webp", CORAZON: "corazon.webp", 
    LENTO: "lento.webp", PASE: "pase.webp", INCREIBLE: "increible.webp", SEGUIR: "seguir.webp", 
    CORAZON_AZUL: "azul.webp", ROSA_1M: "rosa.webp", ROSA_BLANCA_METAL: "blanca.webp", 
    TIKTOK_3D: "tiktok.webp", GG_3D: "gg.webp", ROSE_30M: "rose.webp", ROSQUILLA: "rosquilla.webp", 
    GAFAS: "gafas.webp", CONFETTI: "confetti.webp", GORRA: "gorra.webp", OSITO: "osito.webp",
    ADORO: "adoro.webp", ALAS: "alas.webp", APLAUSO: "aplauso.webp", CONO: "cono.webp"
};

const tarjetasHeroes = [
    { g: "5.webp", c: "c-h1", id: "dar_vida", gift: "ADORO", esHeroe: true }, // Quitados los mult de todos
    { g: "6.webp", c: "c-h2", id: "vida_todos", gift: "ALAS", esHeroe: true },
    { g: "7.webp", c: "c-h3", id: "arma_random", gift: "APLAUSO", esHeroe: true },
    { g: "8.webp", c: "c-h4", id: "matar_enemigos", gift: "CONO", esHeroe: true }
];

const tarjetasVillanos = [
    { g: "1.webp", c: "c-1", infNombre: "WITCH", mult: "X5", dobleGift: true }, 
    { g: "2.webp", c: "c-2", infNombre: "TANK", mult: "X1", gift: "ROSA_1M" }, 
    { g: "3.webp", c: "c-3", infNombre: "BAILE 10 SEGUNDOS", gift: "ROSA_BLANCA_METAL" }, 
    { g: "4.webp", c: "c-4", infNombre: "CHARGER", mult: "X1", gift: "TIKTOK_3D" }, 
    { g: "9.webp", c: "c-5", infNombre: "HUNTER", mult: "X1", gift: "GG_3D" },
    { g: "10.webp", c: "c-6", infNombre: "SMOKER", mult: "X1", gift: "INCREIBLE" },
    { g: "11.webp", c: "c-7", infNombre: "TANK", mult: "X10", gift: "CORAZON" },
    { g: "4.webp", c: "c-8", infNombre: "CHARGER", mult: "X10", gift: "CABEZA" }, 
    { g: "13.webp", c: "c-9", infNombre: "SMOKER HUNTER WITCH", mult: "X30", gift: "LENTO" }, 
    { g: "14.webp", c: "c-10", infNombre: "SMOKER SPITTER CHARGER", mult: "X30", gift: "PASE" }, 
    { g: "15.webp", c: "c-11", infNombre: "INCAPACITAR SUPERVIVIENTES", gift: "ROSE_30M" }, 
    { g: "16.webp", c: "c-12", infNombre: "ATAQUE AEREO",  gift: "BOSQUE" }, 
    { g: "17.webp", c: "c-13", infNombre: "REINICIAR MAPA",  gift: "CAPIBARA" }, 
    { g: "18.webp", c: "c-14", infNombre: "ELIMINAR TODOS LOS SUPERVIVIENTES", gift: "ROSQUILLA" }, 
    { g: "19.webp", c: "c-15", infNombre: "SMOKER TANK", mult: "X40", gift: "GORRA" }, 
    { g: "20.webp", c: "c-16", infNombre: "HUNTER WITCH", mult: "X40", gift: "CONFETTI" }, 
    { g: "21.webp", c: "c-17", infNombre: "TANK", mult: "X50", gift: "OSITO" }
];
</script>


<script>
function drawSvgTitleHeroes() {
    return `<svg class="svg-wrapper-title-heroes" viewBox="0 0 1080 160">
             <text x="540" y="115" font-family="Oswald, sans-serif" font-weight="700" font-size="96px" font-style="italic" text-anchor="middle" fill="#2aff2a" stroke="#02111d" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill" filter="url(#brilloHeroes)">HEROES</text>
           </svg>`;
}

function drawSvgTitleVillanos() {
    return `<svg class="svg-wrapper-title-villanos" viewBox="0 0 3780 160">
             <text x="1890" y="115" font-family="Oswald, sans-serif" font-weight="700" font-size="96px" font-style="italic" text-anchor="middle" fill="#ff2a2a" stroke="#02111d" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill" filter="url(#brilloVillanos)">VILLANOS</text>
           </svg>`;
}

function drawSvgTop(texto) {
    return `<svg class="svg-wrapper-top" viewBox="0 0 540 140">
             <text x="26" y="106" font-family="Oswald, sans-serif" font-weight="700" font-size="102px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 4px 4px 15px #ff2a2a, -4px -4px 15px #ff2a2a;">${texto}</text>
           </svg>`;
}

function drawSvgBottomHeroeManual(idTarjeta) {
    let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 540 280">`;
    if (idTarjeta === "dar_vida") {
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="58px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">VIDA</text>`;
        htmlSvg += `<text x="26" y="155" font-family="Oswald, sans-serif" font-weight="700" font-size="58px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">DAR</text>`;
    } 
    else if (idTarjeta === "vida_todos") {
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">A TODOS</text>`;
        htmlSvg += `<text x="26" y="160" font-family="Oswald, sans-serif" font-weight="700" font-size="52px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">DAR VIDA</text>`;
    } 
    else if (idTarjeta === "arma_random") {
        // MODIFICACIÓN MANUAL: Se removió la palabra "DAR" y se ajustaron los renglones fijos
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="58px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">RANDOM</text>`;
        htmlSvg += `<text x="26" y="155" font-family="Oswald, sans-serif" font-weight="700" font-size="58px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">ARMA</text>`;
    } 
    else if (idTarjeta === "matar_enemigos") {
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="38px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">LOS ENEMIGOS</text>`;
        htmlSvg += `<text x="26" y="180" font-family="Oswald, sans-serif" font-weight="700" font-size="38px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 12px #2aff2a, -3px -3px 12px #2aff2a;">MATAR TODOS</text>`;
    }
    return htmlSvg + `</svg>`;
}
</script>

<script>
function drawSvgBottomVillano(texto) {
    let textoLimpio = String(texto).trim();
    let palabras = textoLimpio.split(/\s+/);
    let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 540 280">`;
    
    if (textoLimpio === "BAILE 10 SEGUNDOS") {
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">10 SEGUNDOS</text>`;
        htmlSvg += `<text x="26" y="167" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">BAILE</text>`;
    }
    else if (palabras.length > 1) {
        let palabrasInvertivas = palabras.slice().reverse();
        for (let i = 0; i < palabrasInvertivas.length; i++) {
            let posY = 225 - (i * 58);
            htmlSvg += `<text x="26" y="${posY}" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a; max-width: 320px;">${palabrasInvertivas[i]}</text>`;
        }
    } else {
        htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="54px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 4px 4px 12px #ff2a2a, -4px -4px 12px #ff2a2a;">${textoLimpio}</text>`;
    }
    return htmlSvg + `</svg>`;
}

function generarTarjetaHTML(t) {
    let esTarjetaAncha = (t.c === "c-11" || t.c === "c-14" || t.c === "c-16" || t.c === "c-17");
    let anchoEstilo = esTarjetaAncha ? 'width: 1080px !important;' : 'width: 540px !important;';
    let html = `<div class="card ${t.c}" style="${anchoEstilo} height: 680px !important;">`; 
    let sombraNeon = t.esHeroe ? '#2aff2a' : '#ff2a2a';
    
    if (t.mult) {
        html += drawSvgTop(t.mult);
    }
    html += `<div class="img-box"><img src="${t.g}" alt="Icono"></div>`;
    
    if (t.esHeroe) {
        html += drawSvgBottomHeroeManual(t.id);
    } else if (t.infNombre) {
        if (esTarjetaAncha) {
            let htmlSvg = `<svg class="svg-wrapper-bottom" viewBox="0 0 1080 280">`;
            if (t.infNombre === "INCAPACITAR SUPERVIVIENTES") {
                htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">SUPERVIVIENTES</text>`;
                htmlSvg += `<text x="26" y="167" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">INCAPACITAR</text>`;
            } else if (t.infNombre === "ELIMINAR TODOS LOS SUPERVIVIENTES") {
                htmlSvg += `<text x="26" y="225" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">LOS SUPERVIVIENTES</text>`;
                htmlSvg += `<text x="26" y="167" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">ELIMINAR TODOS</text>`;
            } else {
                let textoLimpio = String(t.infNombre).trim();
                let palabras = textoLimpio.split(/\s+/);
                let palabrasInvertidas = palabras.slice().reverse();
                for (let i = 0; i < palabrasInvertidas.length; i++) {
                    let posY = 225 - (i * 58);
                    htmlSvg += `<text x="26" y="${posY}" font-family="Oswald, sans-serif" font-weight="700" font-size="44px" font-style="italic" text-anchor="start" fill="#ffffff" stroke="#02111d" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill" style="text-shadow: 3px 3px 10px #ff2a2a, -3px -3px 10px #ff2a2a;">${palabrasInvertidas[i]}</text>`;
                }
            }
            html += htmlSvg + `</svg>`;
        } else {
            html += drawSvgBottomVillano(t.infNombre);
        }
    }
    if (t.dobleGift) {
        html += `<div class="esq-der-doble"><div class="sub-box-regalo"><div class="texto-seguir-interno">SEGUIRME</div><img src="regalos/${REGALOS.SEGUIR}" alt="Seguir"></div><div class="sub-box-regalo"><img src="regalos/${REGALOS.CORAZON_AZUL}" alt="Azul"></div></div>`;
    } else if (t.gift && REGALOS[t.gift]) {
        html += `<div class="esq-der-regalo"><img src="regalos/${REGALOS[t.gift]}" alt="Regalo"></div>`;
    }
    return html + `</div>`;
}

if (container) {
    let estructuraFinal = `<div class="bloque-heroes">${drawSvgTitleHeroes()}<div class="cuadrilla-heroes">`;
    tarjetasHeroes.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    estructuraFinal += `</div></div><div class="bloque-villanos">${drawSvgTitleVillanos()}<div class="cuadrilla-villanos">`;
    tarjetasVillanos.forEach(t => estructuraFinal += generarTarjetaHTML(t));
    container.innerHTML = estructuraFinal + `</div></div>`;
}
</script>
</body>
</html>
