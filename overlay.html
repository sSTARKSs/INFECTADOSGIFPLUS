<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay L4D Horizontal - TikTok Studio Edition Premium</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
/* CONEXIÓN NATIVA AL LIENZO FULL HD SIN LAG */
html, body { 
    margin: 0 !important; 
    padding: 0 !important;
    background: transparent !important; 
    overflow: hidden !important; 
    width: 1920px !important; 
    height: 1080px !important; 
    display: flex !important; 
    justify-content: center !important; 
    align-items: center !important; 
    font-family: 'Bebas Neue', sans-serif !important; 
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    image-rendering: -webkit-optimize-contrast !important;
    position: relative !important;
}

/* CONTENEDOR MAESTRO FORZADO AL CENTRO CON ESCALA GENERAL PRO INTERNA */
#overlay-container { 
    display: flex !important; 
    gap: 24px !important; 
    justify-content: center !important; 
    align-items: center !important; 
    box-sizing: border-box !important; 
    width: 1920px !important; 
    height: 1080px !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) scale(0.31) !important; 
    transform-origin: center center !important;
    will-change: transform !important;
    backface-visibility: hidden !important;
}

/* RECUADROS CON FONDO SÓLIDO EQUILIBRADO Y BAJO CONSUMO */
.bloque-heroes { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    justify-content: center !important;
    gap: 0px !important; 
    margin: 0 auto !important;
    padding: 20px !important;
    border-radius: 24px !important;
    background: #062617 !important; 
    border: 6px solid #00ff88 !important; 
}

.bloque-villanos { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    justify-content: center !important;
    gap: 0px !important; 
    margin: 0 auto !important;
    padding: 20px !important;
    border-radius: 24px !important;
    background: #2b030c !important; 
    border: 6px solid #ff003c !important; 
}
</style>

<style>
/* CUADRÍCULAS CON ESPACIADO FLUIDO SIMÉTRICO FORZADO AL CENTRO */
.cuadrilla-heroes { 
    display: grid !important; 
    grid-template-columns: repeat(2, 540px) !important; 
    grid-template-rows: repeat(2, 680px) !important; 
    gap: 16px 16px !important; 
    justify-content: center !important;
}
.cuadrilla-villanos { 
    display: grid !important; 
    grid-template-columns: repeat(7, 540px) !important; 
    grid-template-rows: repeat(2, 680px) !important; 
    gap: 16px 16px !important; 
    justify-content: center !important;
}

/* CABECERAS VECTORIALES */
.svg-wrapper-title-heroes { width: 1080px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 auto -10px auto !important; }
.svg-wrapper-title-villanos { width: 3780px !important; height: 160px !important; pointer-events: none !important; display: block !important; margin: 0 auto -10px auto !important; }

/* MARCADORES INTERNOS */
.svg-wrapper-top { position: absolute !important; top: -15px !important; left: -15px !important; width: 545px !important; height: 160px !important; z-index: 45 !important; pointer-events: none !important; }
.svg-wrapper-bottom { position: absolute !important; bottom: -15px !important; left: -15px !important; width: 545px !important; height: 320px !important; z-index: 45 !important; pointer-events: none !important; }

/* TEXTO DE LA WITCH PREMIUM */
.texto-witch-premium {
    position: absolute !important;
    top: 30px !important;
    right: 35px !important;
    font-family: 'Bebas Neue', sans-serif !important;
    font-size: 85px !important;
    font-style: italic !important;
    font-weight: 900 !important;
    color: #ffffff !important;
    text-shadow: 8px 8px 0px #040508, -8px -8px 0px #040508, 8px -8px 0px #040508, -8px 8px 0px #040508 !important;
    z-index: 50 !important;
}

@keyframes pulso-quantum {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* BASE DE LA TARJETA ACELERADA */
.card { 
    position: relative !important; 
    box-sizing: border-box !important; 
    overflow: hidden !important;
    background: #040508 !important;
}

.card::before {
    content: '' !important;
    position: absolute !important;
    top: -50% !important;
    left: -50% !important;
    width: 200% !important;
    height: 200% !important;
    z-index: 1 !important;
    animation: pulso-quantum 8s linear infinite !important; 
}

.bloque-heroes .card::before { background: conic-gradient(#00ff88, #014d25, #00ff88) !important; }
.bloque-villanos .card::before { background: conic-gradient(#ff003c, #4d0012, #ff003c) !important; }

/* CONTENEDOR DE IMÁGENES ALTA VELOCIDAD */
.img-box { 
    position: absolute !important; 
    top: 6px !important; 
    left: 6px !important; 
    width: calc(100% - 12px) !important; 
    height: calc(100% - 12px) !important; 
    overflow: hidden !important; 
    z-index: 5 !important;
    background: #040508 !important;
}
.bloque-heroes .img-box { clip-path: polygon(12% 0%, 100% 0%, 100% 88%, 88% 100%, 0% 100%, 0% 12%) !important; }
.bloque-villanos .img-box { clip-path: polygon(0% 0%, 88% 0%, 100% 12%, 100% 100%, 12% 100%, 0% 88%) !important; }

.img-box img { width: 100% !important; height: 100% !important; object-fit: cover !important; }

/* CAJAS DE REGALOS CONFIGURADAS EN LA ESQUINA INFERIOR DERECHA */
.esq-der-regalo { position: absolute !important; bottom: 25px !important; right: 25px !important; width: 220px !important; height: 190px !important; background: linear-gradient(135deg, #111a2e, #1a2947) !important; border: 4px solid rgba(220, 235, 255, 0.9) !important; border-radius: 18px !important; display: flex !important; justify-content: center !important; align-items: center !important; z-index: 15 !important; }
.esq-der-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; }
.esq-der-doble { position: absolute !important; bottom: 25px !important; right: 25px !important; display: flex !important; flex-direction: row !important; align-items: center !important; gap: 16px !important; z-index: 15 !important; }
.sub-box-regalo { width: 220px !important; height: 190px !important; background: linear-gradient(135deg, #111a2e, #1a2947) !important; border: 4px solid rgba(220, 235, 255, 0.9) !important; border-radius: 18px !important; display: flex !important; justify-content: center !important; align-items: center !important; }
.sub-box-regalo img { width: 88% !important; height: 88% !important; object-fit: contain !important; }

/* AJUSTE VECTORIAL MAESTRO */
.text-heroe-svg { position: absolute !important; top: 15px !important; left: -25px !important; width: 545px !important; height: 260px !important; z-index: 45 !important; }
.text-villano-svg { position: absolute !important; top: 0px !important; left: 0px !important; width: 540px !important; height: 680px !important; z-index: 45 !important; pointer-events: none !important; }
</style>
</head>
